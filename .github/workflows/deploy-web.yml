name: Deploy web (static)

# Builds the Expo web export and publishes it to GitHub Pages.
# Requires repo Settings → Pages → Source = "GitHub Actions".
# Optional: add an EXPO_PUBLIC_BACKEND_URL secret to point the build at a
# live backend. Without it the app deploys as a UI-only preview.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Export static web build
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.EXPO_PUBLIC_BACKEND_URL }}
          # Serves the web app from the /Avirlog subpath on GitHub Pages.
          # app.config.js only applies baseUrl when this is set, so native
          # store builds stay clean.
          EXPO_WEB_BASE_URL: /Avirlog
        run: npx expo export --platform web

      - name: Add SPA fallback + bypass Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # A real static /privacy/ page (HTTP 200) generated from PRIVACY.md —
      # App Store Connect validates the privacy policy URL server-side, and
      # the SPA fallback alone answers it with a 404 status.
      - name: Generate static privacy page
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p frontend/dist/privacy
          npx --yes marked --gfm < PRIVACY.md > /tmp/privacy-body.html
          {
            echo '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>AvirLog — Privacy Policy</title>'
            echo '<style>body{max-width:680px;margin:0 auto;padding:32px 20px 64px;font:16px/1.65 -apple-system,"Segoe UI",system-ui,sans-serif;color:#1C1C1C;background:#F7F7F5}h1,h2{letter-spacing:-.3px}a{color:#4A5E98}@media (prefers-color-scheme:dark){body{color:#E6E6E6;background:#121212}a{color:#7EA8D9}}</style>'
            echo '</head><body>'
            cat /tmp/privacy-body.html
            echo '</body></html>'
          } > frontend/dist/privacy/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
