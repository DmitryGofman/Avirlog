<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Option I (Soul Flames)</title>
<style>
  /* OPTION I "Soul Flames" — two spirit flames burn in bronze braziers at
     the bottom of the Ronin world, ALWAYS alive: the left a violet-rose
     silk flame, the right a gold-crimson blade flame. Logging makes yours
     surge into a pillar of light. Both = the flames bow toward each other
     and a white twin-flame rises between them. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#25355C),var(--sky2,#1B2745) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%); top:11%;
    width:150px; height:150px; border-radius:50%;
    background:var(--sun,#E9EDF5);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:42%; height:60%; background:var(--far,#2E4068);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:54%; height:50%; background:var(--mid,#232F52);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:66%; height:40%; background:var(--near,#161F3A);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }

  .screen { flex:1; display:flex; flex-direction:column; padding:54px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#EDF0FA); opacity:.75; }
  h1 { font-size:27px; font-weight:200; letter-spacing:1px; color:var(--text,#EDF0FA); margin:8px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:12.5px; color:var(--text,#EDF0FA); opacity:.7; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; top:31%; text-align:center; pointer-events:none;
    color:var(--text,#EDF0FA); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---------- braziers & flames ---------- */
  .altar { margin-top:auto; position:relative; height:300px; display:flex; align-items:flex-end; justify-content:space-around; }
  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; background:none; padding:0; transition:transform .18s ease; }
  button:active { transform:scale(.95); }
  .brazier { display:flex; flex-direction:column; align-items:center; position:relative; width:150px; }

  .flamebox { position:relative; width:120px; height:190px; display:flex; align-items:flex-end; justify-content:center; }
  .fl {
    position:absolute; bottom:26px; width:64px; height:110px;
    border-radius:50% 50% 22% 22% / 62% 62% 20% 20%;
    filter:blur(4px);
    transform-origin:50% 100%;
    animation:dance 1.1s ease-in-out infinite alternate;
    transition:height .6s cubic-bezier(.22,1,.36,1), width .6s ease, filter .6s ease;
  }
  .fl.core { width:30px; height:64px; filter:blur(2px); animation-duration:.7s; bottom:28px; }
  @keyframes dance {
    from { transform:scaleY(.94) skewX(-4deg); }
    to   { transform:scaleY(1.1) skewX(5deg); }
  }
  #br-left .fl.outer { background:linear-gradient(0deg, rgba(120,40,160,.15), #8E3ACF 40%, #E578E8 75%, #FFDCF5); }
  #br-left .fl.core  { background:linear-gradient(0deg, rgba(255,190,240,.3), #FFCDEF 70%, #FFFFFF); }
  #br-right .fl.outer { background:linear-gradient(0deg, rgba(150,50,10,.15), #D6541E 40%, #FFAE3C 75%, #FFF1C2); }
  #br-right .fl.core  { background:linear-gradient(0deg, rgba(255,225,150,.35), #FFE9AE 70%, #FFFFFF); }

  /* surge state: pillar of light */
  .brazier.surge .fl.outer { height:180px; width:78px; filter:blur(5px); }
  .brazier.surge .fl.core { height:130px; width:36px; }
  .brazier.surge .flamebox::after {
    content:""; position:absolute; left:50%; bottom:20px; transform:translateX(-50%);
    width:5px; height:260px; border-radius:3px;
    background:linear-gradient(0deg, rgba(255,255,255,.85), transparent);
    animation:beam 1.6s ease-out forwards;
  }
  @keyframes beam { 0%{opacity:0} 20%{opacity:1} 100%{opacity:0} }

  /* the bronze bowl */
  .bowl { position:relative; z-index:2; }
  .bowl svg { display:block; }

  .nm { font-size:14.5px; font-weight:600; color:var(--text,#EDF0FA); letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.7); margin-top:8px; }

  /* twin flame (Both) rises between braziers */
  #twin {
    position:absolute; left:50%; bottom:64px; transform:translateX(-50%);
    width:60px; height:0; border-radius:50% 50% 30% 30% / 70% 70% 20% 20%;
    background:linear-gradient(0deg, rgba(200,220,255,.25), #DCE8FF 55%, #FFFFFF);
    filter:blur(4px); pointer-events:none; opacity:0;
    transition:height .7s cubic-bezier(.22,1,.36,1), opacity .5s ease;
  }
  #twin.rise { height:230px; opacity:.95; animation:dance 1s ease-in-out infinite alternate; }
  /* both flames lean inward on Both */
  .altar.meet #br-left .fl { transform-origin:50% 100%; animation-name:leanR; }
  .altar.meet #br-right .fl { animation-name:leanL; }
  @keyframes leanR { from{transform:rotate(10deg) scaleY(.96)} to{transform:rotate(16deg) scaleY(1.08)} }
  @keyframes leanL { from{transform:rotate(-10deg) scaleY(.96)} to{transform:rotate(-16deg) scaleY(1.08)} }

  /* the Both press zone between braziers */
  #hit-both {
    position:absolute; left:50%; bottom:30px; transform:translateX(-50%);
    width:86px; height:160px; z-index:3; border-radius:20px;
  }
  #hit-both:active { transform:translateX(-50%) scale(.95); }
  #hit-both .ring {
    position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    width:44px; height:44px; border-radius:50%;
    border:2px dashed rgba(230,238,255,.65);
    display:flex; align-items:center; justify-content:center;
    color:rgba(235,242,255,.9); font-size:15px;
    animation:spinSlow 24s linear infinite;
  }
  @keyframes spinSlow { to{transform:translateX(-50%) rotate(360deg)} }
  #hit-both .bnm {
    position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
    font-size:12px; font-weight:600; color:var(--text,#EDF0FA); text-shadow:0 2px 8px rgba(0,0,0,.8);
  }

  .ember { position:absolute; width:5px; height:5px; border-radius:50%; opacity:0; pointer-events:none; z-index:6; }
  .ember.fly { animation:riseE 1.9s ease-out forwards; }
  @keyframes riseE {
    0% { opacity:0; transform:translate(0,0) scale(1); }
    12% { opacity:1; }
    100% { opacity:0; transform:translate(var(--dx),-170px) scale(.4); }
  }

  /* time chips */
  .chips { display:flex; gap:6px; padding:12px 0 14px; }
  .chip {
    flex:1; height:40px; border-radius:12px; font-size:15px;
    background:rgba(0,0,0,.3); color:var(--text,#EDF0FA); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:4; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#EDF0FA); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Scroll IX · The Twin Braziers</div>
      <h1>Feed the <b>true flame</b></h1>
      <div class="sub">both fires never die — but one always burns brighter</div>

      <div class="altar" id="altar">
        <button class="brazier" id="br-left" onclick="surge('left', event)">
          <div class="flamebox">
            <div class="fl outer"></div>
            <div class="fl core"></div>
          </div>
          <div class="bowl">
            <svg width="130" height="46" viewBox="0 0 130 46">
              <path d="M8 6 Q65 26 122 6 L114 26 Q65 44 16 26 Z" fill="#6E4A26"/>
              <path d="M8 6 Q65 26 122 6 L120 12 Q65 30 10 12 Z" fill="#9C7038"/>
              <ellipse cx="65" cy="7" rx="57" ry="6" fill="#3A2410"/>
              <path d="M30 34 Q34 42 42 44 M100 34 Q96 42 88 44" stroke="#6E4A26" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="nm">Left nostril</span>
        </button>

        <button id="hit-both" onclick="surge('both', event)">
          <span class="ring">☯</span>
          <span class="bnm">Both</span>
        </button>
        <div id="twin"></div>

        <button class="brazier" id="br-right" onclick="surge('right', event)">
          <div class="flamebox">
            <div class="fl outer"></div>
            <div class="fl core"></div>
          </div>
          <div class="bowl">
            <svg width="130" height="46" viewBox="0 0 130 46">
              <path d="M8 6 Q65 26 122 6 L114 26 Q65 44 16 26 Z" fill="#5E4A5E"/>
              <path d="M8 6 Q65 26 122 6 L120 12 Q65 30 10 12 Z" fill="#8A6E8A"/>
              <ellipse cx="65" cy="7" rx="57" ry="6" fill="#2E1E2E"/>
              <path d="M30 34 Q34 42 42 44 M100 34 Q96 42 88 44" stroke="#5E4A5E" stroke-width="5" fill="none" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="nm">Right nostril</span>
        </button>
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-m="now">◉<small>now</small></button>
        <button class="chip" data-m="390">🌅</button>
        <button class="chip" data-m="720">☀️</button>
        <button class="chip" data-m="1050">🌇</button>
        <button class="chip" data-m="1380">🌙</button>
        <button class="chip" data-m="play">▶</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>🔥</span>Flame</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option I · Soul Flames — twin braziers always burning; yours surges into a pillar, Both makes them bow together.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  let curMins=0, animId=null;
  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720;
    const start=performance.now(), DUR=1400;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=9000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
  })();

  const CAP={left:"the violet flame surges — silk over steel tonight",
             right:"the golden flame surges — steel over silk this hour",
             both:"the flames bow to each other — a white fire rises"};
  const EMB={left:["#FF9ED8","#E578E8","#FFDCF5"], right:["#FFAE3C","#FF7A2E","#FFF1C2"], both:["#DCE8FF","#FFFFFF","#BFD4FF"]};
  let capT=null;
  function embers(x,y,colors){
    const phone=document.getElementById("phone");
    const pr=phone.getBoundingClientRect();
    for(let i=0;i<10;i++){
      const e=document.createElement("div");
      e.className="ember";
      e.style.background=colors[i%3];
      e.style.boxShadow="0 0 8px "+colors[i%3];
      e.style.left=(x-pr.left+(Math.random()*50-25))+"px";
      e.style.top=(y-pr.top-20)+"px";
      e.style.setProperty("--dx",(Math.random()*70-35)+"px");
      e.style.animationDelay=(Math.random()*.4)+"s";
      phone.appendChild(e);
      requestAnimationFrame(()=>e.classList.add("fly"));
      setTimeout(()=>e.remove(),2500);
    }
  }
  function surge(state, ev){
    const altar=document.getElementById("altar");
    const bl=document.getElementById("br-left"), br=document.getElementById("br-right");
    const twin=document.getElementById("twin");
    bl.classList.remove("surge"); br.classList.remove("surge");
    altar.classList.remove("meet"); twin.classList.remove("rise");
    void altar.offsetWidth;
    if(state==="left") bl.classList.add("surge");
    else if(state==="right") br.classList.add("surge");
    else { altar.classList.add("meet"); twin.classList.add("rise"); }
    embers(ev.clientX, ev.clientY, EMB[state]);
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      bl.classList.remove("surge"); br.classList.remove("surge");
      altar.classList.remove("meet"); twin.classList.remove("rise");
      c.classList.remove("show");
    }, 3200);
  }
</script>
</body>
</html>
