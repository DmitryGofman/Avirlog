<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Rōnin Mind · Option C (The Bridge)</title>
<style>
  /* OPTION C: the control IS one brain. A single wide brain sits at the
     bottom of the Rōnin world, split into two pressable halves — the
     painterly artist half (left nostril) and the blueprint engineer half
     (right nostril) — with the corpus-callosum bridge as the Both button.
     Background runs on the real clock. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop); transition:opacity 2s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%);
    width:180px; height:180px; border-radius:50%;
    background:var(--sun);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:44%; height:60%; background:var(--far);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:56%; height:50%; background:var(--mid);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:70%; height:36%; background:var(--near);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }
  .pine { position:absolute; bottom:23%; right:9%; pointer-events:none; }
  .pine svg { fill:var(--ink); }

  .screen { flex:1; display:flex; flex-direction:column; padding:56px 26px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text); opacity:.75; }
  h1 { font-size:28px; font-weight:200; letter-spacing:1px; color:var(--text); margin:10px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:13px; color:var(--text); opacity:.75; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; bottom:288px; text-align:center; pointer-events:none;
    color:var(--text); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---- the brain control ---- */
  .mind { margin-top:auto; position:relative; height:168px; }
  .half {
    position:absolute; top:0; bottom:26px; width:47%;
    border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
    backdrop-filter:blur(6px);
    transition:transform .15s ease, box-shadow .4s ease, opacity .4s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:#fff; font-family:inherit;
  }
  .half:active { transform:scale(.95); }
  /* artist half: big rounded outer, flat inner (brain silhouette halves) */
  #h-art {
    left:0; border-radius:110px 14px 14px 90px / 130px 14px 14px 110px;
    background:
      radial-gradient(60% 45% at 30% 30%, rgba(255,110,140,.5), transparent 70%),
      radial-gradient(50% 40% at 62% 55%, rgba(89,200,255,.42), transparent 70%),
      radial-gradient(55% 42% at 34% 74%, rgba(255,198,61,.42), transparent 70%),
      rgba(30,16,34,.66);
    border:2px solid rgba(255,180,160,.5);
  }
  #h-eng {
    right:0; border-radius:14px 110px 90px 14px / 14px 130px 110px 14px;
    background:
      linear-gradient(rgba(140,180,230,.12) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140,180,230,.12) 1px, transparent 1px),
      rgba(14,22,38,.72);
    background-size:14px 14px, 14px 14px, auto;
    border:2px solid rgba(150,190,235,.45);
  }
  #h-art:hover { box-shadow:0 0 34px rgba(255,140,120,.35); }
  #h-eng:hover { box-shadow:0 0 34px rgba(120,170,230,.35); }
  .half.lit { box-shadow:0 0 44px rgba(255,255,255,.35); }
  .half .nm { font-size:17px; font-weight:700; letter-spacing:1px; }
  .half .who { font-size:10px; letter-spacing:2px; text-transform:uppercase; opacity:.75; }
  .half .ic { font-size:22px; }
  #h-eng .nm, #h-eng .who { font-family:ui-monospace,Menlo,monospace; }

  /* the bridge (Both) */
  #h-bridge {
    position:absolute; left:50%; top:8px; bottom:34px; width:34px; transform:translateX(-50%);
    border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;
    background:rgba(240,242,248,.16); backdrop-filter:blur(8px);
    border-radius:12px; border:1.5px dashed rgba(255,255,255,.55);
    color:#fff; font-size:10px; letter-spacing:2px; text-transform:uppercase;
    writing-mode:vertical-rl; text-orientation:mixed;
    transition:background .3s ease, box-shadow .4s ease, transform .15s ease;
    font-family:inherit;
  }
  #h-bridge:active { transform:translateX(-50%) scale(.94); }
  #h-bridge:hover, #h-bridge.lit { background:rgba(240,242,248,.34); box-shadow:0 0 34px rgba(255,255,255,.4); }
  /* spark travels the bridge on Both */
  .zap { position:absolute; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:#fff; opacity:0; pointer-events:none; z-index:5; }
  .zap.go { animation:travel .9s ease-in-out 2; }
  @keyframes travel { 0%{top:20px;opacity:1} 100%{top:120px;opacity:1} }

  .mindfoot { position:absolute; left:0; right:0; bottom:2px; text-align:center; font-size:9.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--text); opacity:.55; }

  .scrub { display:flex; align-items:center; gap:10px; padding:8px 2px 14px; color:var(--text); font-size:10.5px; }
  .scrub input { flex:1; accent-color:#fff; height:3px; cursor:pointer; }
  .scrub .t { font-family:ui-monospace,Menlo,monospace; opacity:.85; min-width:44px; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:2; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="pine">
      <svg width="90" height="120" viewBox="0 0 90 120">
        <path d="M44 118 L46 118 L46 66 L44 66 Z"/>
        <path d="M45 8 L20 40 L34 38 L12 62 L30 60 L8 84 L45 74 L82 84 L60 60 L78 62 L56 38 L70 40 Z"/>
      </svg>
    </div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Chapter VII · The Long Road</div>
      <h1>Cross the <b>bridge</b></h1>
      <div class="sub">left nostril wakes the artist · right wakes the engineer</div>

      <div class="mind">
        <button class="half" id="h-art" onclick="wake('left')">
          <span class="ic">🎨</span>
          <span class="nm">Left</span>
          <span class="who">ida → artist mind</span>
        </button>
        <button id="h-bridge" onclick="wake('both')">both · bridge</button>
        <button class="half" id="h-eng" onclick="wake('right')">
          <span class="ic">⚙︎</span>
          <span class="nm">Right</span>
          <span class="who">pingala → engineer</span>
        </button>
        <div class="zap" id="zap"></div>
        <div class="mindfoot">one breath · two minds</div>
      </div>

      <div class="scrub">
        <span>☀</span>
        <input type="range" id="clock" min="0" max="1439" step="1" oninput="scrub(this.value)">
        <span class="t" id="tlabel">14:32</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⛩</span>Road</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option C · The Bridge — the whole control is one brain: two pressable halves, the bridge between them is Both.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  function setTime(mins){
    const h=mins/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
    const lbl=document.getElementById("tlabel");
    if(lbl) lbl.textContent=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(Math.round(mins%60)).padStart(2,"0");
  }
  function scrub(v){ setTime(+v); }
  (function initClock(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const now=new Date(), mins=now.getHours()*60+now.getMinutes();
    const slider=document.getElementById("clock");
    if(slider) slider.value=mins;
    setTime(mins);
  })();

  const CAP={left:"the artist is awake — wander, feel, make",
             right:"the engineer is awake — plan, build, decide",
             both:"a spark crosses the bridge — the whole mind opens"};
  let capT=null;
  function wake(state){
    ["h-art","h-eng","h-bridge"].forEach(id=>document.getElementById(id).classList.remove("lit"));
    if(state==="left") document.getElementById("h-art").classList.add("lit");
    else if(state==="right") document.getElementById("h-eng").classList.add("lit");
    else {
      ["h-art","h-eng","h-bridge"].forEach(id=>document.getElementById(id).classList.add("lit"));
      const z=document.getElementById("zap");
      z.classList.remove("go"); void z.getBoundingClientRect(); z.classList.add("go");
    }
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      ["h-art","h-eng","h-bridge"].forEach(id=>document.getElementById(id).classList.remove("lit"));
      c.classList.remove("show");
    }, 3000);
  }
</script>
</body>
</html>
