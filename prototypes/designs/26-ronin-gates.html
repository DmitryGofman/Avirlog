<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Rōnin Mind · Option F (Two Gates)</title>
<style>
  /* OPTION F "Two Gates": the buttons are part of the LANDSCAPE — two huge
     torii-like gates standing in the foreground hills. Through the left
     gate you glimpse a soft moonlit garden in bloom; through the right, a
     sharp geometric citadel. Walk (tap) through the gate that matches your
     breath. Both = the narrow path between them. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#25355C),var(--sky2,#1B2745) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%); top:12%;
    width:160px; height:160px; border-radius:50%;
    background:var(--sun,#E9EDF5);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:40%; height:60%; background:var(--far,#2E4068);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:52%; height:50%; background:var(--mid,#232F52);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:64%; height:42%; background:var(--near,#161F3A);
          clip-path:polygon(0 26%, 20% 40%, 42% 22%, 60% 38%, 78% 26%, 100% 36%, 100% 100%, 0 100%); }

  .screen { flex:1; display:flex; flex-direction:column; padding:54px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#EDF0FA); opacity:.75; }
  h1 { font-size:27px; font-weight:200; letter-spacing:1px; color:var(--text,#EDF0FA); margin:8px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:12.5px; color:var(--text,#EDF0FA); opacity:.7; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; top:33%; text-align:center; pointer-events:none;
    color:var(--text,#EDF0FA); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---- the two gates ---- */
  .gates { margin-top:auto; display:flex; align-items:flex-end; gap:0; position:relative; height:300px; }
  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; transition:transform .2s ease, filter .4s ease; background:none; padding:0; }
  button:active { transform:scale(.96); }
  .gate { flex:1; position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .gate svg { width:100%; height:auto; display:block; }
  .gate .nm {
    position:absolute; bottom:14px; font-size:15.5px; font-weight:600; color:#FFF6EE;
    letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  .gate.lit { filter:drop-shadow(0 0 24px rgba(255,255,255,.45)); }
  #g-left:hover { filter:drop-shadow(0 0 20px rgba(255,150,200,.5)); }
  #g-right:hover { filter:drop-shadow(0 0 20px rgba(130,190,245,.5)); }

  /* the path between (Both) */
  #g-path {
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:64px; height:190px; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  }
  #g-path:active { transform:translateX(-50%) scale(.95); }
  #g-path svg { width:100%; }
  #g-path .nm { position:absolute; bottom:14px; font-size:13px; font-weight:600; color:#FFF6EE; text-shadow:0 2px 10px rgba(0,0,0,.7); }
  #g-path.lit { filter:drop-shadow(0 0 26px rgba(255,255,255,.6)); }

  /* time chips */
  .chips { display:flex; gap:6px; padding:12px 0 14px; }
  .chip {
    flex:1; height:40px; border-radius:12px; font-size:15px;
    background:rgba(0,0,0,.3); color:var(--text,#EDF0FA); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:4; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#EDF0FA); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Chapter VII · The Long Road</div>
      <h1>Two gates <b>on the road</b></h1>
      <div class="sub">step through the one your breath already chose</div>

      <div class="gates">
        <!-- LEFT GATE: rounded arch, garden glimpse, moon, petals, curves -->
        <button class="gate" id="g-left" onclick="wake('left')">
          <svg viewBox="0 0 180 290" fill="none">
            <!-- glimpse through the arch -->
            <path d="M34 270 L34 130 Q90 60 146 130 L146 270 Z" fill="url(#garden)"/>
            <!-- garden details -->
            <path d="M52 250 Q64 230 60 208 M60 208 Q50 214 52 226 M60 208 Q70 212 68 224" stroke="#8ED8B8" stroke-width="3" stroke-linecap="round" opacity=".9"/>
            <circle cx="118" cy="118" r="16" fill="#FFF2D9" opacity=".95"/>
            <circle cx="112" cy="114" r="14" fill="url(#garden2)" opacity=".4"/>
            <g fill="#FF9EC4" opacity=".9">
              <ellipse cx="96" cy="180" rx="6" ry="3" transform="rotate(-20 96 180)"/>
              <ellipse cx="120" cy="200" rx="5" ry="2.6" transform="rotate(14 120 200)"/>
              <ellipse cx="76" cy="212" rx="5.5" ry="3" transform="rotate(-6 76 212)"/>
              <ellipse cx="108" cy="236" rx="5" ry="2.6" transform="rotate(20 108 236)"/>
            </g>
            <path d="M40 262 Q90 244 140 262" stroke="#FFC9DE" stroke-width="3" opacity=".6"/>
            <!-- rounded gate frame -->
            <path d="M22 278 L22 128 Q90 42 158 128 L158 278" stroke="var(--ink,#0E1428)" stroke-width="17" stroke-linecap="round"/>
            <path d="M10 120 Q90 30 170 120" stroke="var(--ink,#0E1428)" stroke-width="15" stroke-linecap="round"/>
            <defs>
              <linearGradient id="garden" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3E2A55"/><stop offset=".6" stop-color="#6E3E68"/><stop offset="1" stop-color="#9E5578"/>
              </linearGradient>
              <radialGradient id="garden2"><stop offset="0" stop-color="#FFF"/><stop offset="1" stop-color="transparent"/></radialGradient>
            </defs>
          </svg>
          <span class="nm">Left nostril</span>
        </button>

        <!-- BOTH: the narrow path between the gates -->
        <button id="g-path" onclick="wake('both')">
          <svg viewBox="0 0 64 190" fill="none">
            <path d="M26 188 L30 60 L34 60 L38 188 Z" fill="#EDE6D4" opacity=".9"/>
            <circle cx="32" cy="40" r="10" stroke="#EDE6D4" stroke-width="3"/>
            <path d="M32 26 v-10" stroke="#EDE6D4" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span class="nm">Both</span>
        </button>

        <!-- RIGHT GATE: angular gate, citadel glimpse, sun, geometry -->
        <button class="gate" id="g-right" onclick="wake('right')">
          <svg viewBox="0 0 180 290" fill="none">
            <!-- glimpse through the angular arch -->
            <path d="M34 270 L34 120 L90 66 L146 120 L146 270 Z" fill="url(#citadel)"/>
            <!-- citadel details: towers, scaffolds, sun -->
            <g stroke="#9FD0F0" stroke-width="3" stroke-linecap="round" opacity=".9">
              <path d="M58 250 V196 h16 V250"/>
              <path d="M98 250 V178 h20 V250"/>
              <path d="M84 196 l14 -18"/>
              <path d="M52 220 h70" opacity=".5"/>
              <path d="M52 236 h70" opacity=".4"/>
            </g>
            <circle cx="116" cy="118" r="13" stroke="#FFE9B0" stroke-width="3.5"/>
            <path d="M116 100 v-8 M116 136 v8 M98 118 h-8 M134 118 h8 M104 106 l-6 -6 M128 130 l6 6 M128 106 l6 -6 M104 130 l-6 6" stroke="#FFE9B0" stroke-width="3"/>
            <!-- angular gate frame -->
            <path d="M22 278 L22 116 L90 50 L158 116 L158 278" stroke="var(--ink,#0E1428)" stroke-width="17" stroke-linejoin="miter"/>
            <path d="M8 124 L90 42 L172 124" stroke="var(--ink,#0E1428)" stroke-width="15"/>
            <defs>
              <linearGradient id="citadel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#16283E"/><stop offset=".6" stop-color="#1E3A56"/><stop offset="1" stop-color="#2A4E6E"/>
              </linearGradient>
            </defs>
          </svg>
          <span class="nm">Right nostril</span>
        </button>
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-m="now">◉<small>now</small></button>
        <button class="chip" data-m="390">🌅</button>
        <button class="chip" data-m="720">☀️</button>
        <button class="chip" data-m="1050">🌇</button>
        <button class="chip" data-m="1380">🌙</button>
        <button class="chip" data-m="play">▶</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⛩</span>Road</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option F · Two Gates — the buttons are part of the landscape: a garden gate, a citadel gate, and the path between.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  let curMins=0, animId=null;
  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720;
    const start=performance.now(), DUR=1400;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=9000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
  })();

  const CAP={left:"through the garden gate — bloom, drift, restore",
             right:"through the citadel gate — measure, raise, resolve",
             both:"the middle path — narrow, quiet, entirely yours"};
  let capT=null;
  function wake(state){
    ["g-left","g-right","g-path"].forEach(id=>document.getElementById(id).classList.remove("lit"));
    if(state==="both") ["g-left","g-right","g-path"].forEach(id=>document.getElementById(id).classList.add("lit"));
    else document.getElementById(state==="left"?"g-left":"g-right").classList.add("lit");
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      ["g-left","g-right","g-path"].forEach(id=>document.getElementById(id).classList.remove("lit"));
      c.classList.remove("show");
    }, 3000);
  }
</script>
</body>
</html>
