<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Rōnin Mind · Option D (Banners)</title>
<style>
  /* OPTION D "Banners": Rōnin world on the real clock, with two TALL banner
     buttons. No explicit words about minds — the left banner speaks in
     curves, moon, petals and color; the right in rays, gears, angles and
     steel. Time control = tappable chips + a play-the-day button. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#25355C),var(--sky2,#1B2745) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%); top:14%;
    width:170px; height:170px; border-radius:50%;
    background:var(--sun,#E9EDF5);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:44%; height:60%; background:var(--far,#2E4068);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:56%; height:50%; background:var(--mid,#232F52);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:70%; height:36%; background:var(--near,#161F3A);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }
  .pine { position:absolute; bottom:30%; right:9%; pointer-events:none; }
  .pine svg { fill:var(--ink,#0E1428); }

  .screen { flex:1; display:flex; flex-direction:column; padding:54px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#EDF0FA); opacity:.75; }
  h1 { font-size:27px; font-weight:200; letter-spacing:1px; color:var(--text,#EDF0FA); margin:8px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:12.5px; color:var(--text,#EDF0FA); opacity:.7; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; top:37%; text-align:center; pointer-events:none;
    color:var(--text,#EDF0FA); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---- BIG banner buttons ---- */
  .banners { margin-top:auto; display:flex; gap:12px; }
  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; transition:transform .16s ease, box-shadow .4s ease; }
  button:active { transform:scale(.96); }
  .banner {
    flex:1; height:196px; border-radius:22px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
    padding-bottom:14px; color:#FFF6EE; backdrop-filter:blur(6px);
  }
  #b-left {
    background:linear-gradient(170deg, rgba(120,60,110,.55), rgba(60,25,70,.7));
    border:1.5px solid rgba(255,170,200,.45);
  }
  #b-right {
    background:linear-gradient(170deg, rgba(35,60,95,.6), rgba(15,28,50,.75));
    border:1.5px solid rgba(150,200,240,.45);
  }
  #b-left:hover, #b-left.lit { box-shadow:0 0 40px rgba(255,140,190,.4); }
  #b-right:hover, #b-right.lit { box-shadow:0 0 40px rgba(110,180,240,.4); }
  .banner svg.art { position:absolute; inset:0; width:100%; height:100%; }
  .banner .nm { position:relative; font-size:21px; font-weight:700; letter-spacing:.5px; text-shadow:0 2px 8px rgba(0,0,0,.5); }
  .banner .nn { position:relative; font-size:10.5px; letter-spacing:3px; text-transform:uppercase; opacity:.75; }

  .bothbar {
    margin-top:12px; width:100%; height:66px; border-radius:18px; position:relative; overflow:hidden;
    background:linear-gradient(90deg, rgba(120,60,110,.45), rgba(240,240,245,.22) 50%, rgba(35,60,95,.5));
    border:1.5px solid rgba(255,255,255,.4); color:#FFF6EE;
    display:flex; align-items:center; justify-content:center; gap:12px;
    backdrop-filter:blur(6px); font-size:17px; font-weight:600;
  }
  .bothbar:hover, .bothbar.lit { box-shadow:0 0 40px rgba(255,255,255,.3); }
  .bothbar .nn { font-size:10px; letter-spacing:3px; text-transform:uppercase; opacity:.7; font-weight:400; }

  /* ---- time chips ---- */
  .chips { display:flex; gap:6px; padding:12px 0 14px; }
  .chip {
    flex:1; height:40px; border-radius:12px; font-size:15px;
    background:rgba(0,0,0,.3); color:var(--text,#EDF0FA); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:2; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#EDF0FA); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="pine">
      <svg width="80" height="106" viewBox="0 0 90 120">
        <path d="M44 118 L46 118 L46 66 L44 66 Z"/>
        <path d="M45 8 L20 40 L34 38 L12 62 L30 60 L8 84 L45 74 L82 84 L60 60 L78 62 L56 38 L70 40 Z"/>
      </svg>
    </div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Chapter VII · The Long Road</div>
      <h1>Which side <b>breathes?</b></h1>
      <div class="sub">the world keeps your hours — log the current within them</div>

      <div class="banners">
        <!-- LEFT: curves, moon, petals, color -->
        <button class="banner" id="b-left" onclick="wake('left')">
          <svg class="art" viewBox="0 0 170 196" fill="none">
            <path d="M-10 150 Q40 120 30 80 Q22 46 60 30" stroke="#FF9EC4" stroke-width="3" stroke-linecap="round" opacity=".7"/>
            <path d="M0 170 Q60 140 55 96 Q52 66 85 52" stroke="#FFC63D" stroke-width="2.5" stroke-linecap="round" opacity=".55"/>
            <path d="M20 186 Q84 158 80 112" stroke="#59C8FF" stroke-width="2.5" stroke-linecap="round" opacity=".5"/>
            <path d="M118 30 a24 24 0 1 0 12 44 a19 19 0 1 1 -12 -44 Z" fill="#FFE9F2" opacity=".9"/>
            <g opacity=".8">
              <ellipse cx="132" cy="104" rx="9" ry="4.5" fill="#FF9EC4" transform="rotate(-24 132 104)"/>
              <ellipse cx="146" cy="120" rx="8" ry="4" fill="#FFC08A" transform="rotate(18 146 120)"/>
              <ellipse cx="128" cy="132" rx="7" ry="3.5" fill="#B07CFF" transform="rotate(-8 128 132)"/>
            </g>
            <circle cx="52" cy="150" r="5" fill="#FF6E8C" opacity=".85"/>
            <circle cx="70" cy="164" r="4" fill="#59C8FF" opacity=".8"/>
            <circle cx="40" cy="168" r="3.5" fill="#FFC63D" opacity=".8"/>
          </svg>
          <span class="nm">Left nostril</span>
          <span class="nn">the moon current</span>
        </button>

        <!-- RIGHT: rays, gear, angles, steel -->
        <button class="banner" id="b-right" onclick="wake('right')">
          <svg class="art" viewBox="0 0 170 196" fill="none" stroke="#BFDCF5">
            <circle cx="52" cy="52" r="17" stroke-width="3"/>
            <path d="M52 28 v-10 M52 76 v10 M28 52 h-10 M76 52 h10 M35 35 l-7 -7 M69 69 l7 7 M69 35 l7 -7 M35 69 l-7 7" stroke-width="3"/>
            <path d="M110 20 L150 60 M118 12 L162 56 M126 6 L170 50" stroke-width="2" opacity=".5"/>
            <path d="M100 120 L134 86 L134 120 Z" stroke-width="2.5" fill="rgba(120,180,235,.14)"/>
            <path d="M20 150 h130 M20 162 h96 M20 174 h112" stroke-width="1.5" opacity=".45"/>
            <circle cx="140" cy="150" r="10" stroke-width="2.5"/>
            <path d="M140 137 v-6 M140 163 v6 M127 150 h-6 M153 150 h6" stroke-width="2.5"/>
          </svg>
          <span class="nm">Right nostril</span>
          <span class="nn">the sun current</span>
        </button>
      </div>

      <button class="bothbar" id="b-both" onclick="wake('both')">
        Both <span class="nn">the meeting of the two</span>
      </button>

      <div class="chips" id="chips">
        <button class="chip" data-m="now">◉<small>now</small></button>
        <button class="chip" data-m="390">🌅</button>
        <button class="chip" data-m="720">☀️</button>
        <button class="chip" data-m="1050">🌇</button>
        <button class="chip" data-m="1380">🌙</button>
        <button class="chip" data-m="play">▶</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⛩</span>Road</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option D · Banners — tall paired banners; tap 🌅☀️🌇🌙 to jump the sky, ▶ plays the whole day.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  let curMins=0, animId=null;
  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720; // shortest wrap
    const start=performance.now(), DUR=1400;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=9000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
  })();

  const CAP={left:"the moon current — soft, unhurried hours",
             right:"the sun current — sharp, capable hours",
             both:"the two meet — a clear and open door"};
  let capT=null;
  function wake(state){
    ["b-left","b-right","b-both"].forEach(id=>document.getElementById(id).classList.remove("lit"));
    if(state==="both") ["b-left","b-right","b-both"].forEach(id=>document.getElementById(id).classList.add("lit"));
    else document.getElementById("b-"+state).classList.add("lit");
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      ["b-left","b-right","b-both"].forEach(id=>document.getElementById(id).classList.remove("lit"));
      c.classList.remove("show");
    }, 3000);
  }
</script>
</body>
</html>
