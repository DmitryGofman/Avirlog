<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog Design 15 — Shōnen</title>
<style>
  /* DIRECTION 15: "Shōnen" — full anime energy. Cel-shaded panels, thick
     outlines, halftone dots, speed lines, and an impact starburst that
     yells LEFT! / RIGHT! when you log. Breath-training arc protagonist. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#22242E; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:40px; overflow:hidden; position:relative;
    background:#F5F2E8;
    box-shadow:0 30px 85px rgba(0,0,0,.7);
    display:flex; flex-direction:column;
  }
  /* halftone corner */
  .phone::before {
    content:""; position:absolute; right:-60px; top:-60px; width:260px; height:260px; z-index:1;
    background:radial-gradient(#2A2C36 1.6px, transparent 1.6px);
    background-size:9px 9px; border-radius:50%;
    opacity:.14; transform:rotate(10deg); pointer-events:none;
  }

  .screen { flex:1; display:flex; flex-direction:column; padding:56px 20px 0; position:relative; z-index:2; }

  .banner {
    background:#2A2C36; color:#F5F2E8; display:inline-block; align-self:flex-start;
    padding:6px 14px; font-size:11px; font-weight:800; letter-spacing:2px;
    transform:skewX(-8deg); box-shadow:4px 4px 0 #FF4D5E;
  }
  h1 {
    font-size:30px; font-weight:900; letter-spacing:-.5px; color:#2A2C36;
    margin:14px 0 2px; font-style:italic; text-transform:uppercase;
    text-shadow:2.5px 2.5px 0 rgba(255,77,94,.35);
  }
  .sub { font-size:13px; font-weight:600; color:#7A7C88; margin-bottom:16px; }

  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; transition:transform .12s ease; }
  button:active { transform:scale(.94) rotate(-1deg); }

  .panels { flex:1; display:flex; gap:14px; min-height:0; }
  .panel {
    flex:1; border:4px solid #2A2C36; border-radius:14px; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    box-shadow:6px 6px 0 rgba(42,44,54,.9);
  }
  #left  { background:linear-gradient(170deg,#B8E8F4,#6BC3DE); }
  #right { background:linear-gradient(170deg,#FFC7A1,#FF7E52); }
  /* speed lines */
  .panel::before {
    content:""; position:absolute; inset:-30%;
    background:repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg 9deg, rgba(255,255,255,.45) 9deg 10.5deg);
    opacity:.35; pointer-events:none;
  }
  .panel .chibi { font-size:52px; position:relative; filter:drop-shadow(2px 3px 0 rgba(42,44,54,.5)); }
  .panel .nm {
    position:relative; font-size:24px; font-weight:900; font-style:italic; text-transform:uppercase;
    color:#2A2C36; -webkit-text-stroke:1px #2A2C36;
    text-shadow:2px 2px 0 #F5F2E8;
  }
  .panel .pw { position:relative; font-size:10.5px; font-weight:800; letter-spacing:2px; color:#2A2C36; background:rgba(245,242,232,.85); padding:3px 10px; border-radius:99px; border:2px solid #2A2C36; }

  .both {
    margin-top:14px; height:64px; border:4px solid #2A2C36; border-radius:14px;
    background:linear-gradient(90deg,#C6B8F4,#EFC6F0); box-shadow:6px 6px 0 rgba(42,44,54,.9);
    display:flex; align-items:center; justify-content:center; gap:12px;
    font-size:19px; font-weight:900; font-style:italic; text-transform:uppercase; color:#2A2C36;
  }
  .both small { font-size:10px; letter-spacing:2px; font-style:normal; }

  .power {
    margin:16px 0 18px; border:3px solid #2A2C36; border-radius:12px; background:#FFFDF6;
    padding:10px 14px; box-shadow:4px 4px 0 rgba(42,44,54,.9);
  }
  .power .t { font-size:10px; font-weight:800; letter-spacing:2px; color:#7A7C88; }
  .power .bar { height:14px; border:2px solid #2A2C36; border-radius:99px; margin-top:6px; overflow:hidden; background:#EDEAE0; }
  .power .fill { height:100%; width:58%; background:repeating-linear-gradient(45deg,#FF4D5E 0 10px,#FF7E52 10px 20px); transition:width .5s cubic-bezier(.34,1.56,.64,1); }
  .power .cap { font-size:11px; font-weight:800; color:#2A2C36; margin-top:5px; }

  .tabs { display:flex; border-top:4px solid #2A2C36; background:#FFFDF6; padding:10px 8px 26px; position:relative; z-index:2; }
  .tab { flex:1; text-align:center; font-size:9.5px; font-weight:800; letter-spacing:1px; color:#A0A2AC; text-transform:uppercase; }
  .tab.on { color:#FF4D5E; }
  .tab span { display:block; font-size:17px; margin-bottom:2px; }

  /* impact starburst */
  .impact {
    position:absolute; z-index:8; pointer-events:none; left:50%; top:42%;
    transform:translate(-50%,-50%) scale(.3) rotate(-6deg); opacity:0;
  }
  .impact.go { animation:baam .9s cubic-bezier(.22,1.4,.36,1) forwards; }
  @keyframes baam {
    0% { transform:translate(-50%,-50%) scale(.3) rotate(-6deg); opacity:0; }
    30% { transform:translate(-50%,-50%) scale(1.15) rotate(2deg); opacity:1; }
    55% { transform:translate(-50%,-50%) scale(1) rotate(-1deg); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1.05) rotate(0deg); opacity:0; }
  }
  .impact .star {
    background:#FFE93D; border:4px solid #2A2C36; padding:20px 30px;
    clip-path:polygon(50% 0%, 61% 12%, 78% 5%, 79% 23%, 96% 26%, 86% 41%, 100% 52%, 84% 60%, 90% 78%, 72% 75%, 66% 93%, 52% 80%, 36% 92%, 32% 74%, 13% 76%, 21% 59%, 3% 51%, 19% 41%, 9% 24%, 27% 23%, 28% 5%, 43% 12%);
    font-size:34px; font-weight:900; font-style:italic; color:#2A2C36; letter-spacing:-1px;
  }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#9A9CA8; }
</style>
</head>
<body>
  <div class="phone">
    <div class="impact" id="impact"><div class="star" id="impact-text">LEFT!!</div></div>
    <div class="screen">
      <div class="banner">EP. 42 — THE NOSTRIL TRIALS</div>
      <h1>Breath check!!</h1>
      <div class="sub">Sensei says: know your current before you fight your day.</div>

      <div class="panels">
        <button class="panel" id="left" onclick="baam('LEFT!!','58%')">
          <span class="chibi">🌊</span>
          <span class="nm">Left</span>
          <span class="pw">IDA · CHILL TYPE</span>
        </button>
        <button class="panel" id="right" onclick="baam('RIGHT!!','78%')">
          <span class="chibi">🔥</span>
          <span class="nm">Right</span>
          <span class="pw">PINGALA · ATTACK TYPE</span>
        </button>
      </div>
      <button class="both" onclick="baam('BALANCE!!','100%')">
        ✨ Both <small>SUSHUMNA · AWAKENED FORM</small>
      </button>

      <div class="power">
        <div class="t">TODAY'S TRAINING</div>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="cap"><span id="xp">7</span>/12 checks — keep going, rookie!</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⚡</span>Battle</div>
      <div class="tab"><span>🌤</span>Today</div>
      <div class="tab"><span>📊</span>Stats</div>
      <div class="tab"><span>📖</span>Saga</div>
      <div class="tab"><span>⚙️</span>Dojo</div>
    </div>
  </div>
  <div class="label">Design 15 · Shōnen — cel-shaded panels, speed lines, and a LEFT!! starburst on every log.</div>
<script>
  let xp=7;
  function baam(text, power){
    const im=document.getElementById("impact");
    document.getElementById("impact-text").textContent=text;
    im.classList.remove("go"); void im.getBoundingClientRect(); im.classList.add("go");
    xp=Math.min(xp+1,12);
    document.getElementById("xp").textContent=xp;
    document.getElementById("fill").style.width=(xp/12*100)+"%";
  }
</script>
</body>
</html>
