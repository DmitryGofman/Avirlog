<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Option K (Living Banners)</title>
<style>
  /* OPTION K "Living Banners" — refined war banners over a fully living sky:
     - banners raised higher and elongated; the Both banner runs the same
       length but much thinner, hanging exactly between the two
     - a 12-stop day palette: true black night → pre-dawn indigo → sunrise →
       morning → clear noon → afternoon → golden hour → sunset → blue hour →
       night, blended continuously by the real clock
     - the sun crosses the sky by day; at night the MOON rises in its actual
       current phase (computed astronomically, on-device, no API) */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0E0C12; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#04060F),var(--sky2,#02030A) 72%);
    box-shadow:0 30px 90px rgba(0,0,0,.8);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 36% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1.2s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }

  /* celestial bodies */
  #sunEl {
    position:absolute; left:50%; margin-left:-72px; width:144px; height:144px; border-radius:50%;
    background:radial-gradient(circle at 42% 38%, #FFF6DC, #F7DFA0 68%);
    box-shadow:0 0 0 14px rgba(255,244,210,.06), 0 0 0 34px rgba(255,244,210,.04), 0 0 70px rgba(255,230,170,.35);
    pointer-events:none;
  }
  #moonEl { position:absolute; left:56%; width:104px; height:104px; pointer-events:none; }
  #moonEl svg { width:100%; height:100%; filter:drop-shadow(0 0 26px rgba(220,230,255,.3)); }

  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:42%; height:60%; background:var(--far,#10182B);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:54%; height:50%; background:var(--mid,#0B1120);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:66%; height:40%; background:var(--near,#060B16);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }
  .pine { position:absolute; bottom:31%; right:6%; pointer-events:none; opacity:.92; }
  .pine svg { fill:var(--ink,#030710); }

  .screen { flex:1; display:flex; flex-direction:column; padding:50px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#E8ECF8); opacity:.75; }
  h1 { font-size:25px; font-weight:200; letter-spacing:1px; color:var(--text,#E8ECF8); margin:6px 0 0; }
  h1 b { font-weight:700; }

  .caption {
    position:absolute; left:0; right:0; top:24%; text-align:center; pointer-events:none; z-index:5;
    opacity:0; transition:opacity .8s ease;
  }
  .caption span {
    display:inline-block; padding:8px 18px; border-radius:999px;
    background:rgba(8,10,20,.62); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.16);
    color:#F2F4FC; font-size:13.5px; font-weight:400;
  }
  .caption.show { opacity:1; }

  /* ---------- the banner rig — raised & elongated ---------- */
  .rig { margin-top:16px; position:relative; height:412px; flex:1; }
  .rod {
    position:absolute; top:8px; left:4px; right:4px; height:9px; border-radius:5px;
    background:linear-gradient(180deg, #6E4A2A, #4A3018);
    box-shadow:0 3px 6px rgba(0,0,0,.45);
  }
  .rod::before, .rod::after {
    content:""; position:absolute; top:-4px; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8A6238, #3E2812);
  }
  .rod::before { left:-3px; } .rod::after { right:-3px; }

  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; background:none; padding:0; }

  .banner {
    position:absolute; top:14px; width:146px; height:330px;
    transform-origin:50% 0;
    animation:flap 4.6s ease-in-out infinite;
    transition:filter .5s ease;
  }
  #bn-left  { left:10px; }
  #bn-right { right:10px; animation-delay:1.9s; }
  /* light wind flap: a gentle traveling ripple, barely there */
  @keyframes flap {
    0%   { transform:rotate(-.5deg) skewX(-.6deg); }
    28%  { transform:rotate(.6deg)  skewX(1.1deg); }
    52%  { transform:rotate(-.3deg) skewX(-.9deg); }
    76%  { transform:rotate(.4deg)  skewX(.5deg); }
    100% { transform:rotate(-.5deg) skewX(-.6deg); }
  }
  .banner:active { transform:scale(.96) translateY(3px); animation:none; }
  .banner.wave { animation:cloth .95s ease-in-out; }
  /* press: a real kick of wind through the cloth */
  @keyframes cloth {
    0%   { transform:rotate(0) skewX(0) translateY(0); }
    14%  { transform:rotate(2.2deg) skewX(4.5deg) translateY(2px); }
    38%  { transform:rotate(-1.8deg) skewX(-3.4deg) translateY(0); }
    62%  { transform:rotate(1.1deg) skewX(2deg); }
    82%  { transform:rotate(-.5deg) skewX(-.9deg); }
    100% { transform:rotate(0) skewX(0); }
  }
  #bn-left.wave, #bn-left.lit { filter:drop-shadow(0 0 26px rgba(110,170,255,.75)) drop-shadow(0 0 60px rgba(110,170,255,.35)); }
  #bn-right.wave, #bn-right.lit { filter:drop-shadow(0 0 26px rgba(255,110,90,.75)) drop-shadow(0 0 60px rgba(255,110,90,.35)); }
  .banner svg { width:100%; height:100%; display:block; }
  .banner .nm {
    position:absolute; left:0; bottom:-24px; width:100%; text-align:center;
    font-size:14px; font-weight:600; color:var(--text,#E8ECF8);
    letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.7);
  }

  /* the thin Both banner — same length, between the two */
  #bn-both {
    position:absolute; top:14px; left:50%; margin-left:-21px; width:42px; height:318px; z-index:3;
    transform-origin:50% 0;
    animation:flap 5.4s ease-in-out infinite; animation-delay:.9s;
    transition:filter .5s ease;
  }
  #bn-both:active { transform:scale(.95) translateY(3px); animation:none; }
  #bn-both.wave { animation:cloth .95s ease-in-out; }
  #bn-both.wave, #bn-both.lit { filter:drop-shadow(0 0 24px rgba(255,255,255,.85)) drop-shadow(0 0 55px rgba(240,244,255,.4)); }
  #bn-both svg { width:100%; height:100%; display:block; }
  #bn-both .nm {
    position:absolute; left:-20px; bottom:-24px; width:82px; text-align:center;
    font-size:12px; font-weight:600; color:var(--text,#E8ECF8); text-shadow:0 2px 8px rgba(0,0,0,.7);
  }

  /* time chips */
  .chips { display:flex; gap:6px; padding:30px 0 12px; }
  .chip {
    flex:1; height:38px; border-radius:12px; font-size:14px;
    background:rgba(0,0,0,.32); color:var(--text,#E8ECF8); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:10px 8px 26px; background:rgba(0,0,0,.32); backdrop-filter:blur(8px); position:relative; z-index:4; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#E8ECF8); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#A89CA0; }
</style>
</head>

  <div class="label">Option K · Living Banners — 12-stop day spectrum on the real clock; the moon rises at night in its true current phase.</div>

<script>
  /* ---- 12-stop palette: [hour, sky1, sky2, far, mid, near, ink, text, starop] ---- */
  const KEYS=[
    [0,   "#04060F","#02030A","#10182B","#0B1120","#060B16","#030710","#D9DEEC",1],
    [3.5, "#05081A","#030512","#121A30","#0C1324","#070C18","#040814","#D9DEEC",1],
    [5,   "#141B38","#1E1A38","#1E2643","#161D36","#0E1426","#080C1C","#E0E2F0",.8],
    [6,   "#3A3E72","#7E5678","#3A4066","#2C3252","#1C2340","#12162E","#F0EAF0",.35],
    [6.8, "#5E6EA8","#F2A268","#5E5A80","#4A4468","#302E50","#201E3A","#FFF4E4",.05],
    [8,   "#7FB0DC","#C9E2EC","#7FA0BC","#5E86A6","#3E6488","#2A4662","#FFFFFF",0],
    [12,  "#4E9EE0","#A8D8F0","#6E9EC2","#4E82AC","#2E608C","#1E4468","#FFFFFF",0],
    [15,  "#5EA4DC","#B8D8E8","#7AA0BE","#5A84A8","#3A6288","#264462","#FFFFFF",0],
    [17.5,"#6E86B8","#F2C078","#9E7E88","#7A5E70","#523E54","#382640","#FFF4E0",0],
    [19,  "#4E5490","#E8825E","#8A5460","#6E3E50","#48283E","#2E182A","#FFEEDE",.08],
    [20.2,"#2E3560","#4A4278","#3A3A62","#2A2C50","#1A1E3C","#101428","#E8E8F4",.4],
    [21.8,"#12182E","#0C1024","#1A2238","#121A2C","#0A101E","#050A16","#DCE0EE",.85],
    [24,  "#04060F","#02030A","#10182B","#0B1120","#060B16","#030710","#D9DEEC",1],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let curMins=0, animId=null;

  /* ---- real moon phase (synodic month from a known new moon) ---- */
  function moonPhaseFrac(){
    const NEW_MOON=Date.UTC(2000,0,6,18,14), SYNODIC=29.530588853*86400000;
    return ((Date.now()-NEW_MOON)%SYNODIC)/SYNODIC; // 0=new, .5=full
  }
  function drawMoon(){
    const p=moonPhaseFrac(), cx=52, cy=52, r=44;
    const c=Math.cos(2*Math.PI*p), rx=Math.abs(c)*r, waxing=p<.5;
    const sweepOuter=waxing?1:0;
    const sweepInner=(c>0)?(waxing?0:1):(waxing?1:0);
    document.getElementById("moonlit").setAttribute("d",
      `M ${cx} ${cy-r} A ${r} ${r} 0 1 ${sweepOuter} ${cx} ${cy+r} A ${rx} ${r} 0 1 ${sweepInner} ${cx} ${cy-r} Z`);
  }

  /* ---- sun & moon arcs with cross-fade at the horizons ---- */
  function celestial(h){
    const sun=document.getElementById("sunEl"), moon=document.getElementById("moonEl");
    // sun: above horizon ~5.8 → 19.8
    const dayP=(h-5.8)/14;
    if(dayP>0 && dayP<1){
      sun.style.top=(58-50*Math.sin(Math.PI*dayP))+"%";
      sun.style.opacity=clamp(Math.min(dayP,1-dayP)*8,0,1);
    } else sun.style.opacity=0;
    // moon: above horizon ~19.2 → 6.4 (wraps midnight)
    let nightP=(h>=19.2)?(h-19.2)/11.2:(h+4.8)/11.2;
    if(nightP>0 && nightP<1){
      moon.style.top=(50-40*Math.sin(Math.PI*nightP))+"%";
      moon.style.opacity=clamp(Math.min(nightP,1-nightP)*8,0,1);
    } else moon.style.opacity=0;
  }

  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[8]+(B[8]-A[8])*t).toFixed(2));
    celestial(h);
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720;
    const start=performance.now(), DUR=1500;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=12000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<40;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    drawMoon();
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
    setInterval(()=>{ // follow the real clock while idle
      const nn=new Date(), m=nn.getHours()*60+nn.getMinutes();
      if(Math.abs(curMins-m)<2) setTime(m);
    }, 30000);
  })();

  const CAP={left:"the moon banner stirs — water hours, gentle current",
             right:"the sun banner stirs — fire hours, bright current",
             both:"the thin banner lifts — where the two currents meet"};
  let capT=null;
  function raise(state){
    ["bn-left","bn-right","bn-both"].forEach(id=>document.getElementById(id).classList.remove("wave","lit"));
    void document.getElementById("bn-left").offsetWidth;
    const ids = state==="both" ? ["bn-left","bn-right","bn-both"] : ["bn-"+state];
    ids.forEach(id=>document.getElementById(id).classList.add("wave","lit"));
    const c=document.getElementById("caption");
    c.innerHTML="<span>"+CAP[state]+"</span>"; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      ["bn-left","bn-right","bn-both"].forEach(id=>document.getElementById(id).classList.remove("lit","wave"));
      c.classList.remove("show");
    }, 3000);
  }
</script>
</body>
</html>
