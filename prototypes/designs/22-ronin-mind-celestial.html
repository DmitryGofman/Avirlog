<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Rōnin Mind · Option B (Celestial Mind)</title>
<style>
  /* OPTION B: the sun/moon disc IS the mind. The Rōnin world runs on the
     real clock; the celestial disc carries a faint brain etching. Logging
     floods one half of the disc: Left → paint (artist), Right → circuitry
     (engineer), Both → both halves + a spark across the bridge. Buttons
     stay pure Rōnin blades. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop); transition:opacity 2s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }

  /* celestial mind disc */
  .sun {
    position:absolute; left:50%; transform:translateX(-50%);
    width:210px; height:210px; border-radius:50%;
    background:var(--sun);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
    display:flex; align-items:center; justify-content:center;
  }
  .sun svg { width:74%; height:74%; }
  .etch { opacity:.22; }
  .halffill { opacity:0; transition:opacity .8s ease; }
  .halffill.lit, .halffill.lit * { opacity:1; }
  .halffill.lit { opacity:1; }
  .spark { opacity:0; }
  .spark.go { animation:zap 2.6s ease-out forwards; }
  @keyframes zap { 0%{opacity:0} 15%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:44%; height:60%; background:var(--far);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:56%; height:50%; background:var(--mid);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:70%; height:36%; background:var(--near);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }
  .pine { position:absolute; bottom:23%; right:9%; pointer-events:none; }
  .pine svg { fill:var(--ink); }
  .walker { position:absolute; bottom:21.5%; left:14%; pointer-events:none; }
  .walker svg { fill:var(--ink); }

  .screen { flex:1; display:flex; flex-direction:column; padding:56px 26px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text); opacity:.75; }
  h1 { font-size:28px; font-weight:200; letter-spacing:1px; color:var(--text); margin:10px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:13px; color:var(--text); opacity:.75; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; bottom:252px; text-align:center; pointer-events:none;
    color:var(--text); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  .blades { margin-top:auto; padding-bottom:10px; display:flex; flex-direction:column; gap:10px; }
  button {
    border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent;
    background:rgba(0,0,0,.28); color:var(--text); backdrop-filter:blur(6px);
    height:54px; border-radius:12px; overflow:hidden; position:relative;
    display:flex; align-items:center; justify-content:space-between; padding:0 20px;
    transition:transform .15s ease; font-size:15px; letter-spacing:1px;
  }
  button:active { transform:scale(.97); }
  button .tr { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; opacity:.65; }
  .duo { display:flex; gap:10px; } .duo button { flex:1; }
  button::after {
    content:""; position:absolute; top:0; bottom:0; left:-40%; width:26%;
    background:rgba(255,255,255,.35); transform:skewX(-24deg);
  }
  button.slash::after { animation:slash .55s ease-out; }
  @keyframes slash { to { left:120%; } }

  .scrub { display:flex; align-items:center; gap:10px; padding:0 2px 14px; color:var(--text); font-size:10.5px; }
  .scrub input { flex:1; accent-color:#fff; height:3px; cursor:pointer; }
  .scrub .t { font-family:ui-monospace,Menlo,monospace; opacity:.85; min-width:44px; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:2; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>

    <div class="sun" id="sun">
      <svg viewBox="0 0 200 170">
        <!-- faint brain etching, always present -->
        <g class="etch" fill="none" stroke="#5A4A3A" stroke-width="2">
          <path d="M100 18 Q56 15 40 48 Q26 78 40 104 Q52 130 82 136 Q94 139 100 136 Z"/>
          <path d="M100 18 Q144 15 160 48 Q174 78 160 104 Q148 130 118 136 Q106 139 100 136 Z"/>
          <line x1="100" y1="22" x2="100" y2="132" stroke-dasharray="3 5"/>
        </g>
        <!-- engineer half (viewer left) -->
        <g class="halffill" id="fill-an">
          <path d="M100 18 Q56 15 40 48 Q26 78 40 104 Q52 130 82 136 Q94 139 100 136 Z"
            fill="rgba(30,45,70,.55)" stroke="#9FC2E8" stroke-width="2.5"/>
          <circle cx="66" cy="70" r="12" fill="none" stroke="#CFE4FA" stroke-width="2.5"/>
          <path d="M66 54 v-7 M66 86 v7 M50 70 h-7 M82 70 h7" stroke="#CFE4FA" stroke-width="2.5"/>
          <path d="M52 104 h30 M52 112 h22" stroke="#CFE4FA" stroke-width="2" opacity=".8"/>
        </g>
        <!-- artist half (viewer right) -->
        <g class="halffill" id="fill-cr">
          <path d="M100 18 Q144 15 160 48 Q174 78 160 104 Q148 130 118 136 Q106 139 100 136 Z"
            fill="rgba(60,25,50,.45)" stroke="url(#rb)" stroke-width="2.5"/>
          <circle cx="134" cy="58" r="9" fill="#FF6E8C"/>
          <circle cx="152" cy="84" r="7" fill="#FFC63D"/>
          <circle cx="128" cy="98" r="8" fill="#59C8FF"/>
          <circle cx="146" cy="116" r="6" fill="#B07CFF"/>
        </g>
        <!-- the bridge spark -->
        <g class="spark" id="spark" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none">
          <path d="M78 78 L94 72 L91 82 L108 74 L105 86 L122 78"/>
        </g>
        <defs><linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF6E8C"/><stop offset=".5" stop-color="#FFC63D"/><stop offset="1" stop-color="#59C8FF"/>
        </linearGradient></defs>
      </svg>
    </div>

    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="pine">
      <svg width="90" height="120" viewBox="0 0 90 120">
        <path d="M44 118 L46 118 L46 66 L44 66 Z"/>
        <path d="M45 8 L20 40 L34 38 L12 62 L30 60 L8 84 L45 74 L82 84 L60 60 L78 62 L56 38 L70 40 Z"/>
      </svg>
    </div>
    <div class="walker">
      <svg width="34" height="52" viewBox="0 0 34 52">
        <circle cx="17" cy="7" r="5"/>
        <path d="M13 13 L21 13 L24 34 L20 34 L22 50 L18 50 L16 36 L14 50 L10 50 L12 34 L8 34 Z"/>
        <path d="M21 15 L32 26 L30 29 L20 20 Z"/>
      </svg>
    </div>

    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Chapter VII · The Long Road</div>
      <h1>The sky keeps <b>your mind</b></h1>
      <div class="sub">log a breath — watch which half of the heavens wakes</div>

      <div class="blades">
        <div class="duo">
          <button onclick="wake(this,'left')">Left <span class="tr">ida · artist</span></button>
          <button onclick="wake(this,'right')">Right <span class="tr">pingala · engineer</span></button>
        </div>
        <button onclick="wake(this,'both')">Both <span class="tr">sushumna · whole mind</span></button>
      </div>

      <div class="scrub">
        <span>☀</span>
        <input type="range" id="clock" min="0" max="1439" step="1" oninput="scrub(this.value)">
        <span class="t" id="tlabel">14:32</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⛩</span>Road</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option B · Celestial Mind — the sun/moon disc carries the brain; each log wakes one half of it.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  function setTime(mins){
    const h=mins/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
    const lbl=document.getElementById("tlabel");
    if(lbl) lbl.textContent=String(Math.floor(mins/60)).padStart(2,"0")+":"+String(Math.round(mins%60)).padStart(2,"0");
  }
  function scrub(v){ setTime(+v); }
  (function initClock(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const now=new Date(), mins=now.getHours()*60+now.getMinutes();
    const slider=document.getElementById("clock");
    if(slider) slider.value=mins;
    setTime(mins);
  })();

  const CAP={left:"the artist half of the sky wakes — wander, feel, make",
             right:"the engineer half wakes — plan, build, decide",
             both:"the bridge sparks — the whole sky is thinking"};
  let capT=null;
  function wake(btn,state){
    btn.classList.remove("slash"); void btn.offsetWidth; btn.classList.add("slash");
    const an=document.getElementById("fill-an"), cr=document.getElementById("fill-cr"), sp=document.getElementById("spark");
    an.classList.remove("lit"); cr.classList.remove("lit"); sp.classList.remove("go");
    // swara mapping: left nostril → right hemisphere (artist), right nostril → left (engineer)
    if(state==="left") cr.classList.add("lit");
    else if(state==="right") an.classList.add("lit");
    else { an.classList.add("lit"); cr.classList.add("lit"); void sp.getBoundingClientRect(); sp.classList.add("go"); }
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{ an.classList.remove("lit"); cr.classList.remove("lit"); c.classList.remove("show"); }, 3200);
  }
</script>
</body>
</html>
