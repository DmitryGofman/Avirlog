<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Option G (Spirit Eyes)</title>
<style>
  /* OPTION G "Spirit Eyes" — cultivation-manhua energy. Two great eyes hold
     living flame: the left burns violet-rose and flows like silk; the right
     burns gold-azure and cuts like a blade. Press one and it BLAZES, embers
     rising. Between them sleeps a closed third eye — press it and it opens.
     World below: the Ronin landscape on the real clock. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#25355C),var(--sky2,#1B2745) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%); top:12%;
    width:150px; height:150px; border-radius:50%;
    background:var(--sun,#E9EDF5);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:42%; height:60%; background:var(--far,#2E4068);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:54%; height:50%; background:var(--mid,#232F52);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:66%; height:40%; background:var(--near,#161F3A);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }

  .screen { flex:1; display:flex; flex-direction:column; padding:54px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#EDF0FA); opacity:.75; }
  h1 { font-size:27px; font-weight:200; letter-spacing:1px; color:var(--text,#EDF0FA); margin:8px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:12.5px; color:var(--text,#EDF0FA); opacity:.7; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; top:33%; text-align:center; pointer-events:none;
    color:var(--text,#EDF0FA); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---------- the eyes ---------- */
  .eyes { margin-top:auto; display:flex; align-items:center; justify-content:space-between; height:250px; padding:0 2px; position:relative; }
  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; background:none; padding:0; transition:transform .18s ease; }
  button:active { transform:scale(.94); }
  .eyebtn { display:flex; flex-direction:column; align-items:center; gap:12px; position:relative; }

  .eye {
    width:152px; height:88px; position:relative; overflow:hidden;
    border-radius:76px 76px 76px 76px / 62px 62px 62px 62px;
    clip-path:polygon(0 50%, 14% 16%, 50% 0, 86% 16%, 100% 50%, 86% 84%, 50% 100%, 14% 84%);
    background:radial-gradient(circle at 50% 55%, #1A1424, #0C0A14 80%);
    box-shadow:inset 0 0 24px rgba(0,0,0,.9);
  }
  /* iris of living flame */
  .iris {
    position:absolute; left:50%; top:50%; width:62px; height:62px; transform:translate(-50%,-50%);
    border-radius:50%;
    animation:pulse 2.6s ease-in-out infinite alternate;
  }
  @keyframes pulse { from{transform:translate(-50%,-50%) scale(1)} to{transform:translate(-50%,-50%) scale(1.08)} }
  #e-left .iris {
    background:radial-gradient(circle at 50% 60%, #FFE1F0 6%, #FF7EB8 26%, #B44BD6 55%, #4B1B66 78%, #1A0A26 100%);
    box-shadow:0 0 34px rgba(220,110,255,.75), 0 0 70px rgba(180,75,214,.4);
  }
  #e-right .iris {
    background:radial-gradient(circle at 50% 60%, #FFF6D0 6%, #FFC24D 26%, #E86A2A 55%, #7E2A14 78%, #260C06 100%);
    box-shadow:0 0 34px rgba(255,180,70,.8), 0 0 70px rgba(232,106,42,.45);
  }
  .pupil {
    position:absolute; left:50%; top:50%; width:14px; height:30px; transform:translate(-50%,-50%);
    border-radius:50%; background:#05030A;
  }
  /* tongues of flame licking up from the iris */
  .flame {
    position:absolute; left:50%; bottom:46%; width:44px; height:56px; transform:translateX(-50%);
    filter:blur(3px); opacity:.85; pointer-events:none;
    animation:flick .5s ease-in-out infinite alternate;
    border-radius:50% 50% 20% 20%;
  }
  @keyframes flick { from{transform:translateX(-50%) scaleY(.9) skewX(-3deg)} to{transform:translateX(-50%) scaleY(1.15) skewX(4deg)} }
  #e-left .flame { background:linear-gradient(0deg, rgba(255,126,184,.0), rgba(216,120,255,.75) 45%, rgba(255,225,240,.9)); }
  #e-right .flame { background:linear-gradient(0deg, rgba(255,194,77,0), rgba(255,150,50,.8) 45%, rgba(255,246,208,.95)); }

  /* eye frame: lashes/brow strokes drawn over */
  .frame { position:absolute; inset:-22px -14px; pointer-events:none; }
  .frame svg { width:100%; height:100%; }
  #e-left .frame path { stroke:#F5D9EC; }
  #e-right .frame path { stroke:#F2E2C4; }

  /* blazing state */
  .eyebtn.blaze .eye { box-shadow:inset 0 0 24px rgba(0,0,0,.9), 0 0 60px 8px rgba(255,255,255,.14); }
  .eyebtn.blaze .iris { animation:pulse .4s ease-in-out infinite alternate; }
  #e-left.blaze .iris { box-shadow:0 0 60px rgba(226,120,255,1), 0 0 130px rgba(186,85,224,.7); }
  #e-right.blaze .iris { box-shadow:0 0 60px rgba(255,190,80,1), 0 0 130px rgba(240,120,50,.7); }
  .nm { font-size:14.5px; font-weight:600; color:var(--text,#EDF0FA); letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.7); }

  /* the third eye (Both) — vertical, closed until pressed */
  #e-both { position:absolute; left:50%; top:6px; transform:translateX(-50%); z-index:3; }
  #e-both:active { transform:translateX(-50%) scale(.94); }
  .third {
    width:54px; height:92px; position:relative; overflow:hidden;
    clip-path:polygon(50% 0, 84% 16%, 100% 50%, 84% 84%, 50% 100%, 16% 84%, 0 50%, 16% 16%);
    background:radial-gradient(circle at 50% 50%, #141020, #0A0812 80%);
    display:flex; align-items:center; justify-content:center;
  }
  .lid { position:absolute; left:8px; right:8px; top:50%; height:2.5px; background:#C9CFE8; border-radius:2px; transition:opacity .4s ease; }
  .triris {
    width:38px; height:38px; border-radius:50%;
    background:radial-gradient(circle at 50% 58%, #FFFFFF 8%, #BFE8FF 30%, #7E9CF0 55%, #2E3E80 80%, #10142E 100%);
    box-shadow:0 0 26px rgba(160,200,255,.8);
    opacity:0; transform:scale(.4); transition:all .45s cubic-bezier(.34,1.4,.64,1);
  }
  #e-both.open .lid { opacity:0; }
  #e-both.open .triris { opacity:1; transform:scale(1); }
  #e-both.open .third { box-shadow:0 0 60px rgba(170,205,255,.55); }

  /* rising embers on press */
  .ember { position:absolute; width:5px; height:5px; border-radius:50%; opacity:0; pointer-events:none; z-index:6; }
  .ember.fly { animation:rise 1.8s ease-out forwards; }
  @keyframes rise {
    0% { opacity:0; transform:translate(0,0) scale(1); }
    12% { opacity:1; }
    100% { opacity:0; transform:translate(var(--dx),-130px) scale(.5); }
  }

  /* time chips */
  .chips { display:flex; gap:6px; padding:12px 0 14px; }
  .chip {
    flex:1; height:40px; border-radius:12px; font-size:15px;
    background:rgba(0,0,0,.3); color:var(--text,#EDF0FA); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:4; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#EDF0FA); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Scroll IX · The Inner Flame</div>
      <h1>Whose fire <b>burns?</b></h1>
      <div class="sub">the breath feeds one flame more than the other</div>

      <div class="eyes">
        <button class="eyebtn" id="e-left" onclick="blaze('left', event)">
          <div class="eye">
            <div class="flame"></div>
            <div class="iris"></div>
            <div class="pupil"></div>
          </div>
          <div class="frame">
            <svg viewBox="0 0 180 132" fill="none" stroke-width="3" stroke-linecap="round">
              <path d="M14 66 Q90 4 166 66" />
              <path d="M14 66 Q90 128 166 66" />
              <path d="M28 40 Q16 30 12 18" stroke-width="2.5"/>
              <path d="M48 26 Q40 14 38 4" stroke-width="2.5"/>
              <path d="M150 42 Q160 32 170 26" stroke-width="2"/>
            </svg>
          </div>
          <span class="nm">Left nostril</span>
        </button>

        <button id="e-both" onclick="openThird(event)">
          <div class="third">
            <div class="triris"></div>
            <div class="lid"></div>
          </div>
        </button>

        <button class="eyebtn" id="e-right" onclick="blaze('right', event)">
          <div class="eye">
            <div class="flame"></div>
            <div class="iris"></div>
            <div class="pupil"></div>
          </div>
          <div class="frame">
            <svg viewBox="0 0 180 132" fill="none" stroke-width="3" stroke-linecap="round">
              <path d="M14 66 Q90 4 166 66"/>
              <path d="M14 66 Q90 128 166 66"/>
              <path d="M20 34 L58 22" stroke-width="4"/>
              <path d="M124 20 L164 32" stroke-width="4"/>
            </svg>
          </div>
          <span class="nm">Right nostril</span>
        </button>
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-m="now">◉<small>now</small></button>
        <button class="chip" data-m="390">🌅</button>
        <button class="chip" data-m="720">☀️</button>
        <button class="chip" data-m="1050">🌇</button>
        <button class="chip" data-m="1380">🌙</button>
        <button class="chip" data-m="play">▶</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>👁</span>Flame</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option G · Spirit Eyes — two eyes of living flame; the closed third eye between them opens for Both.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  let curMins=0, animId=null;
  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720;
    const start=performance.now(), DUR=1400;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=9000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
  })();

  const CAP={left:"the violet flame leans in — silk hours, soft power",
             right:"the golden flame leans in — blade hours, clean strikes",
             both:"the third eye opens — see the whole road at once"};
  const EMBER={left:["#FF9ED8","#D878FF","#FFE1F0"], right:["#FFC24D","#FF8A3C","#FFF6D0"], both:["#BFE8FF","#FFFFFF","#9FB8FF"]};
  let capT=null;
  function embers(x, y, colors){
    const phone=document.getElementById("phone");
    const pr=phone.getBoundingClientRect();
    for(let i=0;i<9;i++){
      const e=document.createElement("div");
      e.className="ember";
      e.style.background=colors[i%3];
      e.style.boxShadow="0 0 8px "+colors[i%3];
      e.style.left=(x-pr.left+(Math.random()*60-30))+"px";
      e.style.top=(y-pr.top)+"px";
      e.style.setProperty("--dx",(Math.random()*70-35)+"px");
      e.style.animationDelay=(Math.random()*.4)+"s";
      phone.appendChild(e);
      requestAnimationFrame(()=>e.classList.add("fly"));
      setTimeout(()=>e.remove(),2400);
    }
  }
  function showCap(state){
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      c.classList.remove("show");
      document.getElementById("e-left").classList.remove("blaze");
      document.getElementById("e-right").classList.remove("blaze");
      document.getElementById("e-both").classList.remove("open");
    }, 3000);
  }
  function blaze(state, ev){
    document.getElementById("e-"+state).classList.add("blaze");
    embers(ev.clientX, ev.clientY, EMBER[state]);
    showCap(state);
  }
  function openThird(ev){
    document.getElementById("e-both").classList.add("open");
    document.getElementById("e-left").classList.add("blaze");
    document.getElementById("e-right").classList.add("blaze");
    embers(ev.clientX, ev.clientY, EMBER.both);
    showCap("both");
  }
</script>
</body>
</html>
