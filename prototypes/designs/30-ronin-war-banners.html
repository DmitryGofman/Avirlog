<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog — Option J (War Banners)</title>
<style>
  /* OPTION J "War Banners" — the buttons ARE banners. Two cloth banners
     hang from a wooden rod over the Ronin valley, painted in the same flat
     art as the landscape, kept mild: the left carries a crescent moon over
     water; the right a rayed sun over flame. Between them hangs a short
     eclipse banner for Both. They sway idly like cloth; pressing one sends
     a wave through the fabric and its emblem glows. */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#17131A; padding:24px;
    font-family:-apple-system,"Segoe UI",system-ui,sans-serif;
  }
  .phone {
    width:390px; height:800px; border-radius:44px; overflow:hidden; position:relative;
    background:linear-gradient(180deg,var(--sky1,#25355C),var(--sky2,#1B2745) 70%);
    box-shadow:0 30px 90px rgba(0,0,0,.75);
    display:flex; flex-direction:column;
  }
  .stars { position:absolute; inset:0 0 40% 0; pointer-events:none; opacity:var(--starop,1); transition:opacity 1s ease; }
  .stars i { position:absolute; width:2px; height:2px; border-radius:50%; background:#DDE6FF; animation:tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from{opacity:.15} to{opacity:.9} }
  .sun {
    position:absolute; left:50%; transform:translateX(-50%); top:11%;
    width:150px; height:150px; border-radius:50%;
    background:var(--sun,#E9EDF5);
    box-shadow:0 0 0 14px rgba(255,255,255,.05), 0 0 0 34px rgba(255,255,255,.04);
  }
  .range { position:absolute; left:0; right:0; pointer-events:none; }
  .far  { top:42%; height:60%; background:var(--far,#2E4068);
          clip-path:polygon(0 32%, 12% 20%, 26% 30%, 40% 12%, 55% 28%, 70% 8%, 84% 26%, 100% 16%, 100% 100%, 0 100%); }
  .mid  { top:54%; height:50%; background:var(--mid,#232F52);
          clip-path:polygon(0 40%, 16% 24%, 32% 38%, 50% 18%, 66% 36%, 82% 22%, 100% 34%, 100% 100%, 0 100%); }
  .near { top:66%; height:40%; background:var(--near,#161F3A);
          clip-path:polygon(0 30%, 20% 46%, 42% 26%, 60% 44%, 78% 30%, 100% 42%, 100% 100%, 0 100%); }
  .pine { position:absolute; bottom:31%; right:7%; pointer-events:none; opacity:.9; }
  .pine svg { fill:var(--ink,#0E1428); }

  .screen { flex:1; display:flex; flex-direction:column; padding:54px 22px 0; position:relative; z-index:2; }
  .ep { font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--text,#EDF0FA); opacity:.75; }
  h1 { font-size:27px; font-weight:200; letter-spacing:1px; color:var(--text,#EDF0FA); margin:8px 0 2px; }
  h1 b { font-weight:700; }
  .sub { font-size:12.5px; color:var(--text,#EDF0FA); opacity:.7; font-style:italic; }

  .caption {
    position:absolute; left:0; right:0; top:31%; text-align:center; pointer-events:none;
    color:var(--text,#EDF0FA); font-size:14px; font-weight:300; opacity:0; transition:opacity .8s ease;
  }
  .caption.show { opacity:.95; }

  /* ---------- the banner rig ---------- */
  .rig { margin-top:auto; position:relative; height:320px; }
  /* wooden rod */
  .rod {
    position:absolute; top:12px; left:6px; right:6px; height:9px; border-radius:5px;
    background:linear-gradient(180deg, #6E4A2A, #4A3018);
    box-shadow:0 3px 6px rgba(0,0,0,.4);
  }
  .rod::before, .rod::after {
    content:""; position:absolute; top:-4px; width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8A6238, #3E2812);
  }
  .rod::before { left:-4px; } .rod::after { right:-4px; }

  button { border:none; cursor:pointer; font-family:inherit; -webkit-tap-highlight-color:transparent; background:none; padding:0; }

  .banner {
    position:absolute; top:18px; width:150px; height:252px;
    transform-origin:50% 0;
    animation:sway 5.5s ease-in-out infinite alternate;
    transition:filter .5s ease;
  }
  #bn-left  { left:8px; }
  #bn-right { right:8px; animation-delay:2.2s; }
  @keyframes sway { from{transform:rotate(-1.3deg)} to{transform:rotate(1.4deg)} }
  .banner:active { transform:scale(.97); animation:none; }
  .banner.wave { animation:cloth .9s ease-in-out; }
  @keyframes cloth {
    0% { transform:rotate(0) skewX(0); }
    22% { transform:rotate(1.8deg) skewX(3.5deg); }
    48% { transform:rotate(-1.4deg) skewX(-2.8deg); }
    74% { transform:rotate(.9deg) skewX(1.6deg); }
    100% { transform:rotate(0) skewX(0); }
  }
  #bn-left.wave, #bn-left.lit { filter:drop-shadow(0 0 22px rgba(160,190,255,.45)); }
  #bn-right.wave, #bn-right.lit { filter:drop-shadow(0 0 22px rgba(255,190,120,.45)); }
  .banner svg { width:100%; height:100%; display:block; }
  .banner .nm {
    position:absolute; left:0; bottom:-24px; width:100%; text-align:center;
    font-size:14.5px; font-weight:600; color:var(--text,#EDF0FA);
    letter-spacing:.5px; text-shadow:0 2px 10px rgba(0,0,0,.7);
  }

  /* the short eclipse banner (Both) */
  #bn-both {
    position:absolute; top:18px; left:50%; margin-left:-34px; width:68px; height:150px; z-index:3;
    transform-origin:50% 0;
    animation:sway 6.5s ease-in-out infinite alternate; animation-delay:1s;
    transition:filter .5s ease;
  }
  #bn-both:active { transform:scale(.96); animation:none; }
  #bn-both.wave { animation:cloth .9s ease-in-out; }
  #bn-both.wave, #bn-both.lit { filter:drop-shadow(0 0 22px rgba(235,240,255,.55)); }
  #bn-both svg { width:100%; height:100%; display:block; }
  #bn-both .nm {
    position:absolute; left:0; bottom:-22px; width:100%; text-align:center;
    font-size:12.5px; font-weight:600; color:var(--text,#EDF0FA); text-shadow:0 2px 8px rgba(0,0,0,.7);
  }

  /* time chips */
  .chips { display:flex; gap:6px; padding:12px 0 14px; }
  .chip {
    flex:1; height:40px; border-radius:12px; font-size:15px;
    background:rgba(0,0,0,.3); color:var(--text,#EDF0FA); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .chip.sel { background:rgba(255,255,255,.28); border-color:rgba(255,255,255,.5); }
  .chip small { font-size:8.5px; letter-spacing:1px; margin-left:4px; text-transform:uppercase; opacity:.7; }

  .tabs { display:flex; padding:12px 8px 28px; background:rgba(0,0,0,.3); backdrop-filter:blur(8px); position:relative; z-index:4; }
  .tab { flex:1; text-align:center; font-size:9.5px; letter-spacing:2px; color:var(--text,#EDF0FA); opacity:.5; text-transform:uppercase; }
  .tab.on { opacity:1; }
  .tab span { display:block; font-size:15px; margin-bottom:3px; }
  .label { position:fixed; bottom:18px; width:100%; left:0; text-align:center; font-size:13px; color:#B8ACA8; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="stars" id="stars"></div>
    <div class="sun" id="sun"></div>
    <div class="range far"></div><div class="range mid"></div><div class="range near"></div>
    <div class="pine">
      <svg width="74" height="98" viewBox="0 0 90 120">
        <path d="M44 118 L46 118 L46 66 L44 66 Z"/>
        <path d="M45 8 L20 40 L34 38 L12 62 L30 60 L8 84 L45 74 L82 84 L60 60 L78 62 L56 38 L70 40 Z"/>
      </svg>
    </div>
    <div class="caption" id="caption"></div>

    <div class="screen">
      <div class="ep">Chapter VII · The Long Road</div>
      <h1>Raise your <b>banner</b></h1>
      <div class="sub">the wind already knows which one you'll touch</div>

      <div class="rig">
        <div class="rod"></div>

        <!-- LEFT banner: moon over water — mild indigo cloth -->
        <button class="banner" id="bn-left" onclick="raise('left')">
          <svg viewBox="0 0 150 252">
            <defs>
              <linearGradient id="clothL" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3A3E6E" stop-opacity=".82"/>
                <stop offset="1" stop-color="#2A2450" stop-opacity=".88"/>
              </linearGradient>
            </defs>
            <!-- cloth with swallowtail -->
            <path d="M4 0 H146 V218 L75 250 L4 218 Z" fill="url(#clothL)" stroke="#8E93C4" stroke-width="1.5" stroke-opacity=".55"/>
            <!-- hanging loops -->
            <path d="M28 0 v-6 M75 0 v-6 M122 0 v-6" stroke="#4A3018" stroke-width="5"/>
            <!-- inner stitch border -->
            <path d="M14 10 H136 V212 L75 239 L14 212 Z" fill="none" stroke="#AEB2DC" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
            <!-- crescent moon, flat -->
            <path d="M92 46 a26 26 0 1 0 12 46 a20 20 0 1 1 -12 -46 Z" fill="#EDE8F5" opacity=".92"/>
            <circle cx="52" cy="42" r="2" fill="#C9CFF0" opacity=".8"/>
            <circle cx="44" cy="66" r="1.6" fill="#C9CFF0" opacity=".6"/>
            <!-- flat water bands -->
            <g fill="none" stroke-linecap="round">
              <path d="M22 150 Q40 138 58 150 Q76 162 94 150 Q112 138 130 150" stroke="#7EA8D9" stroke-width="5" opacity=".8"/>
              <path d="M22 172 Q40 160 58 172 Q76 184 94 172 Q112 160 130 172" stroke="#5E7EB8" stroke-width="5" opacity=".65"/>
              <path d="M34 194 Q52 183 70 194 Q88 205 106 194" stroke="#4A5E98" stroke-width="5" opacity=".5"/>
            </g>
            <!-- a single drifting petal -->
            <ellipse cx="46" cy="116" rx="7" ry="3.5" fill="#D9A8C9" opacity=".75" transform="rotate(-18 46 116)"/>
          </svg>
          <span class="nm">Left nostril</span>
        </button>

        <!-- BOTH: short eclipse banner -->
        <button id="bn-both" onclick="raise('both')">
          <svg viewBox="0 0 68 150">
            <defs>
              <linearGradient id="clothB" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4E4A58" stop-opacity=".8"/>
                <stop offset="1" stop-color="#38343F" stop-opacity=".86"/>
              </linearGradient>
            </defs>
            <path d="M3 0 H65 V124 L34 148 L3 124 Z" fill="url(#clothB)" stroke="#C9C4D4" stroke-width="1.2" stroke-opacity=".5"/>
            <path d="M18 0 v-6 M50 0 v-6" stroke="#4A3018" stroke-width="4"/>
            <!-- eclipse: half sun half moon -->
            <circle cx="34" cy="58" r="19" fill="#EDE8DC" opacity=".95"/>
            <path d="M34 39 a19 19 0 0 1 0 38 Z" fill="#2E2A3E"/>
            <path d="M34 24 v-7 M34 92 v7 M14 58 h-7 M54 58 h7" stroke="#D9D4C4" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>
          </svg>
          <span class="nm">Both</span>
        </button>

        <!-- RIGHT banner: sun over flame — mild rust cloth -->
        <button class="banner" id="bn-right" onclick="raise('right')">
          <svg viewBox="0 0 150 252">
            <defs>
              <linearGradient id="clothR" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7E4234" stop-opacity=".82"/>
                <stop offset="1" stop-color="#5E2A26" stop-opacity=".88"/>
              </linearGradient>
            </defs>
            <path d="M4 0 H146 V218 L75 250 L4 218 Z" fill="url(#clothR)" stroke="#D9A088" stroke-width="1.5" stroke-opacity=".55"/>
            <path d="M28 0 v-6 M75 0 v-6 M122 0 v-6" stroke="#4A3018" stroke-width="5"/>
            <path d="M14 10 H136 V212 L75 239 L14 212 Z" fill="none" stroke="#E8B89E" stroke-width="1" stroke-dasharray="4 4" opacity=".45"/>
            <!-- flat rayed sun -->
            <circle cx="75" cy="64" r="22" fill="#F2E2BC" opacity=".95"/>
            <g fill="#F2E2BC" opacity=".85">
              <path d="M75 30 L79 40 L71 40 Z"/>
              <path d="M75 98 L79 88 L71 88 Z"/>
              <path d="M41 64 L51 60 L51 68 Z"/>
              <path d="M109 64 L99 60 L99 68 Z"/>
              <path d="M51 40 L59 45 L53 51 Z"/>
              <path d="M99 88 L91 83 L97 77 Z"/>
              <path d="M99 40 L97 51 L91 45 Z"/>
              <path d="M51 88 L53 77 L59 83 Z"/>
            </g>
            <!-- geometric hint: fine angles by the sun -->
            <path d="M104 44 l14 -12 M108 54 l16 -6" stroke="#E8B89E" stroke-width="1.6" opacity=".5"/>
            <!-- flat flame peaks -->
            <g fill="none" stroke-linecap="round">
              <path d="M26 196 L40 162 L54 190 L70 150 L84 190 L100 160 L114 194" stroke="#E8934A" stroke-width="5" opacity=".8" fill="none" stroke-linejoin="round"/>
              <path d="M36 210 L52 184 L68 206 L84 178 L100 204 L112 188" stroke="#B85A32" stroke-width="5" opacity=".6" stroke-linejoin="round"/>
            </g>
          </svg>
          <span class="nm">Right nostril</span>
        </button>
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-m="now">◉<small>now</small></button>
        <button class="chip" data-m="390">🌅</button>
        <button class="chip" data-m="720">☀️</button>
        <button class="chip" data-m="1050">🌇</button>
        <button class="chip" data-m="1380">🌙</button>
        <button class="chip" data-m="play">▶</button>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span>⛩</span>Road</div>
      <div class="tab"><span>◐</span>Today</div>
      <div class="tab"><span>△</span>Ranges</div>
      <div class="tab"><span>≡</span>Chronicle</div>
      <div class="tab"><span>◦</span>Pack</div>
    </div>
  </div>
  <div class="label">Option J · War Banners — cloth banners in the landscape's own art: moon &amp; water, sun &amp; flame, eclipse for Both.</div>

<script>
  const KEYS=[
    [0,  "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
    [5,  "#2E3A5E","#3E3A55","#F0E6D8","#3A4468","#2C3452","#1E2640","#141A30","#F0EAE0",.5, 24],
    [7,  "#C9DCD9","#EAD9C5","#F7EFE0","#9FB8AE","#7E9C94","#54746E","#3A5652","#FFF8EC",0,  26],
    [12, "#7FB7D9","#AACFE3","#FBF3D9","#7FA3B8","#5E8AA3","#3E6A85","#2A4A60","#FFFFFF",0,  8],
    [17, "#E8B36A","#D98A56","#F7E9C4","#B87A5A","#8E5A54","#5E3A48","#3E2436","#FFF3E4",0,  20],
    [19.5,"#E8896A","#D96A56","#F5E6C4","#A6504A","#7E3A44","#4A2438","#2E1626","#FFF3E4",.1,26],
    [21.5,"#25355C","#1B2745","#E9EDF5","#2E4068","#232F52","#161F3A","#0E1428","#EDF0FA",.8,14],
    [24, "#141C36","#0E1428","#E9EDF5","#223058","#1A2445","#111A33","#0A1020","#E8ECF8",1,  12],
  ];
  const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const mix=(a,b,t)=>"#"+hex(a).map((v,i)=>Math.round(v+(hex(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
  let curMins=0, animId=null;
  function setTime(mins){
    curMins=mins;
    const h=(mins%1440)/60;
    let i=0; while(i<KEYS.length-2 && KEYS[i+1][0]<=h) i++;
    const A=KEYS[i], B=KEYS[i+1], t=(h-A[0])/(B[0]-A[0]);
    const names=["--sky1","--sky2","--sun","--far","--mid","--near","--ink","--text"];
    const ph=document.getElementById("phone");
    names.forEach((n,k)=>ph.style.setProperty(n, mix(A[k+1],B[k+1],t)));
    ph.style.setProperty("--starop",(A[9]+(B[9]-A[9])*t).toFixed(2));
    document.getElementById("sun").style.top=(A[10]+(B[10]-A[10])*t)+"%";
  }
  function tweenTo(target){
    cancelAnimationFrame(animId);
    const from=curMins, diff=((target-from)%1440+2160)%1440-720;
    const start=performance.now(), DUR=1400;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
      setTime((from+diff*e+1440)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  function playDay(){
    cancelAnimationFrame(animId);
    const start=performance.now(), from=curMins, DUR=9000;
    (function step(now){
      const p=Math.min(1,(now-start)/DUR);
      setTime((from+1440*p)%1440);
      if(p<1) animId=requestAnimationFrame(step);
    })(start);
  }
  document.querySelectorAll("#chips .chip").forEach(c=>{
    c.addEventListener("click",()=>{
      document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("sel"));
      c.classList.add("sel");
      const m=c.dataset.m;
      if(m==="play") playDay();
      else if(m==="now"){ const n=new Date(); tweenTo(n.getHours()*60+n.getMinutes()); }
      else tweenTo(+m);
    });
  });
  (function init(){
    const stars=document.getElementById("stars");
    for(let i=0;i<34;i++){
      const s=document.createElement("i");
      s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
      s.style.animationDelay=(Math.random()*3)+"s";
      stars.appendChild(s);
    }
    const n=new Date();
    setTime(n.getHours()*60+n.getMinutes());
    document.querySelector('#chips .chip[data-m="now"]').classList.add("sel");
  })();

  const CAP={left:"the moon banner stirs — water hours, gentle current",
             right:"the sun banner stirs — fire hours, bright current",
             both:"both banners lift at once — the eclipse holds the middle"};
  let capT=null;
  function raise(state){
    const ids={left:["bn-left"], right:["bn-right"], both:["bn-left","bn-right","bn-both"]};
    ["bn-left","bn-right","bn-both"].forEach(id=>{
      const el=document.getElementById(id);
      el.classList.remove("wave","lit");
    });
    void document.getElementById("bn-left").offsetWidth;
    ids[state].forEach(id=>{
      const el=document.getElementById(id);
      el.classList.add("wave","lit");
    });
    if(state==="both") document.getElementById("bn-both").classList.add("wave","lit");
    else if(state==="left"||state==="right") document.getElementById("bn-"+state).classList.add("wave","lit");
    const c=document.getElementById("caption");
    c.textContent=CAP[state]; c.classList.add("show");
    clearTimeout(capT);
    capT=setTimeout(()=>{
      ["bn-left","bn-right","bn-both"].forEach(id=>document.getElementById(id).classList.remove("lit","wave"));
      c.classList.remove("show");
    }, 3000);
  }
</script>
</body>
</html>
