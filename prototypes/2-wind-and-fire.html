<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog · Prototype 2 — Wind &amp; Fire</title>
<style>
  :root {
    --surface: #121212;
    --card: #1E1E1E;
    --text: #E6E6E6;
    --text-dim: #A3A3A3;
    --left: #526658;   --on-left: #E6F0E8;
    --right: #8A4D3E;  --on-right: #FCE3DD;
    --both: #3A3A3A;   --on-both: #E6E6E6;
    --border: #2A2A2A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--surface); color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }

  canvas#fx { position: fixed; inset: 0; pointer-events: none; }

  .grade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .7s ease; }
  #grade-wind { background: linear-gradient(100deg, rgba(160,210,200,.14), rgba(120,180,190,.06) 55%, transparent); }
  #grade-fire {
    background:
      radial-gradient(140% 90% at 50% 118%, rgba(255,110,30,.34), transparent 62%),
      linear-gradient(rgba(255,140,60,.07), rgba(255,140,60,.07));
  }
  /* animated flame ridge along the bottom */
  #flames {
    position: fixed; left: 0; right: 0; bottom: -6px; height: 22vmin;
    pointer-events: none; opacity: 0; transition: opacity .7s ease;
    background:
      radial-gradient(28% 90% at 12% 100%, rgba(255,140,40,.55), transparent 70%),
      radial-gradient(30% 110% at 38% 100%, rgba(255,100,20,.5), transparent 70%),
      radial-gradient(26% 85% at 63% 100%, rgba(255,160,60,.55), transparent 70%),
      radial-gradient(32% 105% at 88% 100%, rgba(255,110,30,.5), transparent 70%);
    filter: blur(6px);
    animation: flick 1.1s ease-in-out infinite alternate;
  }
  @keyframes flick {
    from { transform: scaleY(.9) translateY(2px); }
    to   { transform: scaleY(1.12) translateY(-4px); }
  }

  /* golden equilibrium ring for Both */
  #ring {
    position: fixed; left: 50%; top: 50%; width: 14px; height: 14px;
    border-radius: 50%; border: 2px solid rgba(235,205,140,.9);
    pointer-events: none; opacity: 0; transform: translate(-50%,-50%);
  }
  #ring.go { animation: ring 2.4s ease-out forwards; }
  @keyframes ring {
    0% { opacity: .95; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(80); }
  }

  .frame {
    width: min(380px, 92vw);
    background: var(--card); border: 1px solid var(--border);
    border-radius: 28px; padding: 28px 22px 22px;
    position: relative; z-index: 2;
    transition: filter 1s ease, border-color 1s ease;
    transform-origin: 50% 100%;
  }
  /* the whole UI is pushed by the gusts */
  body.windy .frame { animation: sway 1.6s ease-in-out infinite; filter: saturate(.9) hue-rotate(-6deg); border-color: rgba(150,210,200,.3); }
  @keyframes sway {
    0%, 100% { transform: rotate(0deg) translateX(0); }
    30%      { transform: rotate(1.2deg) translateX(7px); }
    60%      { transform: rotate(-.6deg) translateX(-4px); }
  }
  body.fiery .frame { animation: shimmer .28s ease-in-out infinite; filter: saturate(1.15) sepia(.12); border-color: rgba(255,140,60,.35); }
  @keyframes shimmer {
    0%, 100% { transform: translateY(0) skewX(0deg); }
    50%      { transform: translateY(-1.5px) skewX(.25deg); }
  }
  body.still .frame { animation: settle 2.4s ease-out; }
  @keyframes settle {
    0% { transform: scale(.985); } 40% { transform: scale(1.008); } 100% { transform: scale(1); }
  }

  .brand { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -.4px; margin: 10px 0 2px; }
  .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }
  .row { display: flex; gap: 12px; }
  button {
    font: inherit; color: inherit; border: none; cursor: pointer; border-radius: 18px;
    -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, box-shadow .3s ease;
  }
  button:active { transform: scale(.96); }
  .nostril { flex: 1; height: 148px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .nostril .big { font-size: 20px; font-weight: 600; }
  .nostril .small, .bothbar .small { font-size: 11px; opacity: .75; }
  #btn-left  { background: var(--left);  color: var(--on-left); }
  #btn-right { background: var(--right); color: var(--on-right); }
  .bothbar {
    width: 100%; height: 56px; margin-top: 12px;
    background: var(--both); color: var(--on-both); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  body.windy #btn-left  { box-shadow: 0 0 30px 3px rgba(160,220,205,.4); }
  body.fiery #btn-right { box-shadow: 0 0 34px 4px rgba(255,130,50,.5); }

  .hint { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 18px; }
  .hint kbd { background: #2A2A2A; border: 1px solid #3A3A3A; border-radius: 5px; padding: 1px 6px; font-family: inherit; }
  .caption { position: fixed; bottom: 14px; width: 100%; text-align: center; font-size: 12px; color: #6B6B6B; z-index: 2; }
</style>
</head>
<body>
  <div class="grade" id="grade-wind"></div>
  <div class="grade" id="grade-fire"></div>
  <div id="flames"></div>
  <div id="ring"></div>
  <canvas id="fx"></canvas>

  <main class="frame">
    <div class="brand">AvirLog · Prototype 2</div>
    <h1>Wind &amp; Fire</h1>
    <div class="sub">Which nostril is active right now?</div>
    <div class="row">
      <button class="nostril" id="btn-left" onclick="trigger('left')">
        <span class="big">Left</span><span class="small">Ida · Breeze 🌬</span>
      </button>
      <button class="nostril" id="btn-right" onclick="trigger('right')">
        <span class="big">Right</span><span class="small">Pingala · Blaze 🔥</span>
      </button>
    </div>
    <button class="bothbar" onclick="trigger('both')">
      <span class="big">Both</span><span class="small">Sushumna · Still air</span>
    </button>
    <div class="hint"><kbd>←</kbd> wind &nbsp; <kbd>→</kbd> fire &nbsp; <kbd>↓</kbd>/<kbd>space</kbd> stillness</div>
  </main>
  <div class="caption">Left sends a gust through the whole screen, Right sets the horizon burning, Both lets the air settle.</div>

<script>
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  let W, H;
  const fit = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  addEventListener("resize", fit); fit();

  let particles = [];
  let mode = null;        // "wind" | "fire" | null
  let timer = null;

  function spawnStreaks() {
    for (let i = 0; i < 3; i++) particles.push({
      kind: "streak",
      x: -60, y: Math.random() * H,
      len: 30 + Math.random() * 90,
      vx: 7 + Math.random() * 9,
      drift: (Math.random() - 0.5) * 1.2,
      life: 1,
    });
    // occasional leaf-like fleck riding the gust
    if (Math.random() < 0.3) particles.push({
      kind: "fleck",
      x: -20, y: Math.random() * H,
      r: 1.5 + Math.random() * 2,
      vx: 4 + Math.random() * 5,
      sway: Math.random() * Math.PI * 2,
      life: 1,
    });
  }
  function spawnEmbers() {
    for (let i = 0; i < 3; i++) particles.push({
      kind: "ember",
      x: Math.random() * W, y: H + 10,
      r: 1 + Math.random() * 2.4,
      vy: -(1.2 + Math.random() * 2.6),
      sway: Math.random() * Math.PI * 2,
      life: 1,
    });
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (mode === "wind") spawnStreaks();
    if (mode === "fire") spawnEmbers();

    particles = particles.filter(p => p.life > 0 && p.x < W + 120 && p.y > -20 && p.y < H + 20);
    for (const p of particles) {
      if (!mode) p.life -= 0.03;
      ctx.globalAlpha = Math.max(0, p.life);
      if (p.kind === "streak") {
        p.x += p.vx; p.y += p.drift;
        const g = ctx.createLinearGradient(p.x - p.len, p.y, p.x, p.y);
        g.addColorStop(0, "rgba(190,230,220,0)");
        g.addColorStop(1, "rgba(190,230,220,.55)");
        ctx.strokeStyle = g; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(p.x - p.len, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      } else if (p.kind === "fleck") {
        p.sway += 0.08; p.x += p.vx; p.y += Math.sin(p.sway) * 1.6;
        ctx.fillStyle = "rgba(170,215,195,.8)";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else {
        p.sway += 0.05; p.x += Math.sin(p.sway) * 0.6; p.y += p.vy;
        const flicker = 0.7 + 0.3 * Math.sin(p.sway * 5);
        ctx.fillStyle = `rgba(255,${Math.floor(115 + 85 * flicker)},35,1)`;
        ctx.shadowColor = "rgba(255,120,30,.9)"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * flicker, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();

  const el = id => document.getElementById(id);
  function reset() {
    mode = null;
    document.body.classList.remove("windy", "fiery", "still");
    el("grade-wind").style.opacity = 0;
    el("grade-fire").style.opacity = 0;
    el("flames").style.opacity = 0;
  }

  function trigger(state) {
    clearTimeout(timer);
    reset();
    if (state === "left") {
      mode = "wind";
      document.body.classList.add("windy");
      el("grade-wind").style.opacity = 1;
    } else if (state === "right") {
      mode = "fire";
      document.body.classList.add("fiery");
      el("grade-fire").style.opacity = 1;
      el("flames").style.opacity = 1;
    } else {
      document.body.classList.add("still");
      const ring = el("ring");
      ring.classList.remove("go"); void ring.offsetWidth; ring.classList.add("go");
    }
    timer = setTimeout(reset, 3000);
  }

  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") trigger("left");
    else if (e.key === "ArrowRight") trigger("right");
    else if (e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); trigger("both"); }
  });
</script>
</body>
</html>
