<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AvirLog · Prototype 1 — Ice &amp; Fire</title>
<style>
  :root {
    --surface: #121212;
    --card: #1E1E1E;
    --text: #E6E6E6;
    --text-dim: #A3A3A3;
    --left: #526658;   --on-left: #E6F0E8;
    --right: #8A4D3E;  --on-right: #FCE3DD;
    --both: #3A3A3A;   --on-both: #E6E6E6;
    --border: #2A2A2A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--surface);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background 1.2s ease;
  }

  /* ---------- full-screen temperature grade ---------- */
  .grade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease; }
  .grade.out { transition: opacity 1.1s ease; }
  #grade-cold {
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(140,190,235,.28), transparent 60%),
      radial-gradient(140% 100% at 50% 115%, rgba(70,110,160,.22), transparent 60%),
      linear-gradient(rgba(90,140,200,.10), rgba(90,140,200,.10));
  }
  #grade-warm {
    background:
      radial-gradient(130% 95% at 50% 115%, rgba(255,120,40,.30), transparent 62%),
      radial-gradient(120% 80% at 50% -10%, rgba(255,170,80,.14), transparent 60%),
      linear-gradient(rgba(255,130,60,.08), rgba(255,130,60,.08));
  }
  /* frost creeping in from the edges */
  #frost {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s ease;
    box-shadow: inset 0 0 18vmin 4vmin rgba(190,225,255,.35), inset 0 0 60vmin 10vmin rgba(150,200,245,.14);
  }
  /* heat glow rising from the bottom */
  #heat {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .8s ease;
    box-shadow: inset 0 -16vmin 22vmin -6vmin rgba(255,110,30,.42), inset 0 0 60vmin 8vmin rgba(255,140,60,.10);
  }
  /* balance pulse (Both) */
  #pulse {
    position: fixed; left: 50%; top: 50%; width: 12px; height: 12px;
    border-radius: 50%; pointer-events: none; opacity: 0;
    border: 2px solid rgba(220,215,235,.8);
    transform: translate(-50%,-50%) scale(1);
  }
  #pulse.go { animation: pulse 2.6s ease-out forwards; }
  @keyframes pulse {
    0%   { opacity: .9; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0;  transform: translate(-50%,-50%) scale(90); }
  }

  canvas#fx { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- app mock ---------- */
  .frame {
    width: min(380px, 92vw);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 28px 22px 22px;
    position: relative; z-index: 2;
    transition: filter 1s ease, border-color 1s ease;
  }
  body.cold .frame { filter: saturate(.85) hue-rotate(-8deg) brightness(1.02); border-color: rgba(150,200,245,.35); }
  body.warm .frame { filter: saturate(1.15) sepia(.12) brightness(1.03); border-color: rgba(255,140,60,.35); }

  .brand { font-size: 13px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--text-dim); }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; margin: 10px 0 2px; }
  .sub { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; }

  .row { display: flex; gap: 12px; }
  button {
    font: inherit; color: inherit; border: none; cursor: pointer;
    border-radius: 18px; -webkit-tap-highlight-color: transparent;
    transition: transform .15s ease, box-shadow .3s ease;
  }
  button:active { transform: scale(.96); }
  .nostril { flex: 1; height: 148px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .nostril .big { font-size: 20px; font-weight: 600; }
  .nostril .small, .bothbar .small { font-size: 11px; opacity: .75; }
  #btn-left  { background: var(--left);  color: var(--on-left); }
  #btn-right { background: var(--right); color: var(--on-right); }
  .bothbar {
    width: 100%; height: 56px; margin-top: 12px;
    background: var(--both); color: var(--on-both);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    border: 1px solid var(--border);
  }
  body.cold #btn-left  { box-shadow: 0 0 34px 4px rgba(150,205,255,.45); }
  body.warm #btn-right { box-shadow: 0 0 34px 4px rgba(255,130,50,.5); }

  .hint { text-align: center; font-size: 12px; color: var(--text-dim); margin-top: 18px; }
  .hint kbd { background: #2A2A2A; border: 1px solid #3A3A3A; border-radius: 5px; padding: 1px 6px; font-family: inherit; }
  .caption { position: fixed; bottom: 14px; width: 100%; text-align: center; font-size: 12px; color: #6B6B6B; z-index: 2; }
</style>
</head>
<body>
  <div class="grade" id="grade-cold"></div>
  <div class="grade" id="grade-warm"></div>
  <div id="frost"></div>
  <div id="heat"></div>
  <div id="pulse"></div>
  <canvas id="fx"></canvas>

  <main class="frame">
    <div class="brand">AvirLog · Prototype 1</div>
    <h1>Ice &amp; Fire</h1>
    <div class="sub">Which nostril is active right now?</div>
    <div class="row">
      <button class="nostril" id="btn-left" onclick="trigger('left')">
        <span class="big">Left</span><span class="small">Ida · Cooling ❄</span>
      </button>
      <button class="nostril" id="btn-right" onclick="trigger('right')">
        <span class="big">Right</span><span class="small">Pingala · Heating 🔥</span>
      </button>
    </div>
    <button class="bothbar" onclick="trigger('both')">
      <span class="big">Both</span><span class="small">Sushumna · Balance</span>
    </button>
    <div class="hint"><kbd>←</kbd> ice &nbsp; <kbd>→</kbd> fire &nbsp; <kbd>↓</kbd>/<kbd>space</kbd> balance</div>
  </main>
  <div class="caption">Left freezes the world, Right ignites it, Both restores stillness — ~3&nbsp;s, then it melts back.</div>

<script>
  const canvas = document.getElementById("fx");
  const ctx = canvas.getContext("2d");
  let W, H;
  const fit = () => { W = canvas.width = innerWidth; H = canvas.height = innerHeight; };
  addEventListener("resize", fit); fit();

  let particles = [];
  let mode = null;          // "cold" | "warm" | null
  let timer = null;

  function spawnSnow() {
    for (let i = 0; i < 4; i++) particles.push({
      kind: "snow",
      x: Math.random() * W, y: -10,
      r: 1 + Math.random() * 2.6,
      vy: 0.6 + Math.random() * 1.4,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.03,
      life: 1,
    });
  }
  function spawnEmbers() {
    for (let i = 0; i < 3; i++) particles.push({
      kind: "ember",
      x: Math.random() * W, y: H + 10,
      r: 1 + Math.random() * 2.2,
      vy: -(1 + Math.random() * 2.4),
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.02 + Math.random() * 0.05,
      life: 1,
    });
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (mode === "cold") spawnSnow();
    if (mode === "warm") spawnEmbers();

    particles = particles.filter(p => p.life > 0 && p.y > -20 && p.y < H + 20);
    for (const p of particles) {
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * (p.kind === "snow" ? 0.8 : 0.5);
      p.y += p.vy;
      if (!mode) p.life -= 0.02;          // fade everything out after reset
      ctx.globalAlpha = Math.max(0, p.life) * (p.kind === "snow" ? 0.9 : 0.85);
      if (p.kind === "snow") {
        ctx.fillStyle = "#DCEEFF";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else {
        const flicker = 0.7 + 0.3 * Math.sin(p.sway * 6);
        ctx.fillStyle = `rgba(255,${Math.floor(120 + 80 * flicker)},40,1)`;
        ctx.shadowColor = "rgba(255,120,30,.9)"; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * flicker, 0, 7); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  frame();

  const el = id => document.getElementById(id);
  function reset() {
    mode = null;
    document.body.classList.remove("cold", "warm");
    for (const id of ["grade-cold", "grade-warm", "frost", "heat"]) {
      el(id).classList.add("out"); el(id).style.opacity = 0;
    }
  }

  function trigger(state) {
    clearTimeout(timer);
    reset();
    for (const id of ["grade-cold","grade-warm","frost","heat"]) el(id).classList.remove("out");

    if (state === "left") {
      mode = "cold";
      document.body.classList.add("cold");
      el("grade-cold").style.opacity = 1;
      el("frost").style.opacity = 1;
    } else if (state === "right") {
      mode = "warm";
      document.body.classList.add("warm");
      el("grade-warm").style.opacity = 1;
      el("heat").style.opacity = 1;
    } else {
      const pulse = el("pulse");
      pulse.classList.remove("go"); void pulse.offsetWidth; pulse.classList.add("go");
    }
    timer = setTimeout(reset, 3000);
  }

  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") trigger("left");
    else if (e.key === "ArrowRight") trigger("right");
    else if (e.key === "ArrowDown" || e.key === " ") { e.preventDefault(); trigger("both"); }
  });
</script>
</body>
</html>
